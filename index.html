<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Green Glow Frame</title>

<style>

html,
body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    font-family: Arial, sans-serif;
}

:root {
    --green: #00ff88;
}


/* =====================================================
   COPY TRADE PANEL
   بدون تغییر در ابعاد و ظاهر
===================================================== */

.copy-trade-panel {
    position: absolute;
    left: 40px;
    bottom: 539px;
    width: 430px;
    height: 55px;

    border: 3px solid var(--green);
    box-sizing: border-box;

    background: radial-gradient(
        ellipse at center,
        rgba(0,255,136,.035),
        rgba(0,255,136,.012) 50%,
        transparent 80%
    );

    box-shadow:
        0 0 2px #fff,
        0 0 5px var(--green),
        0 0 10px rgba(0,255,136,.70),
        0 0 20px rgba(0,255,136,.35),
        inset 0 0 10px rgba(0,255,136,.14);

    display: flex;
    align-items: center;
    justify-content: center;
}

.copy-trade-text {
    color: #ff6600;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .7px;
    text-align: center;
    white-space: nowrap;
    text-shadow:
        0 0 2px #ffb066,
        0 0 6px #ff6600,
        0 0 12px rgba(255,102,0,.85);
}


/* =====================================================
   دو پنل اصلی
   ابعاد دقیقاً مثل کد خودت
===================================================== */

.webcam-panel {
    position: absolute;
    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--green);
    box-sizing: border-box;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:
        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

    animation: greenBreath 6s ease-in-out infinite;
}


.webcam-frame {
    position: absolute;
    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--green);
    box-sizing: border-box;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:
        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

    animation: greenBreath 6s ease-in-out infinite;
}


/* =====================================================
   INNER GLOW
===================================================== */

.webcam-panel::before,
.webcam-frame::before {

    content: "";

    position: absolute;

    inset: 5px;

    border: 1px solid rgba(0,255,136,.42);

    box-shadow:
        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

    z-index: 1;
}


/* =====================================================
   MOVING LIGHT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 115px;
    height: 4px;

    background:
        linear-gradient(
            270deg,
            transparent,
            rgba(0,255,136,.45),
            #fff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:
        0 0 4px #fff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreenReverse 7s ease-in-out infinite;

    z-index: 20;
}


.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 105px;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #fff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:
        0 0 4px #fff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreen 7s ease-in-out infinite;

    z-index: 20;
}


/* =====================================================
   GIFT CELEBRATION
   فقط داخل همین دو پنل
===================================================== */

.celebration {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 10;
}


/* =====================================================
   GIFT
===================================================== */

.gift {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 58px;
    height: 52px;

    transform:
        translate(-50%, -50%)
        scale(.3);

    opacity: 0;

    filter:
        drop-shadow(0 0 7px #ff2670)
        drop-shadow(0 0 18px #ff0066);

    animation:
        giftAppear 3.6s
        cubic-bezier(.2, .8, .2, 1)
        infinite;
}


/* جعبه */

.gift-box {
    position: absolute;

    left: 5px;
    bottom: 0;

    width: 48px;
    height: 34px;

    border-radius: 4px;

    background:
        linear-gradient(
            135deg,
            #ff416c,
            #ff005d 55%,
            #c9004b
        );
}


/* درب */

.gift-lid {
    position: absolute;

    left: 1px;
    top: 8px;

    width: 56px;
    height: 11px;

    border-radius: 4px;

    background:
        linear-gradient(
            90deg,
            #ff174f,
            #ff4d7d,
            #ff174f
        );

    transform-origin: left bottom;

    animation: lidOpen 3.6s infinite;
}


/* روبان عمودی */

.gift-ribbon-v {
    position: absolute;

    left: 25px;
    top: 8px;

    width: 8px;
    height: 43px;

    background: #ffd21c;

    box-shadow:
        0 0 6px #ffd21c;
}


/* روبان افقی */

.gift-ribbon-h {
    position: absolute;

    left: 5px;
    top: 22px;

    width: 48px;
    height: 6px;

    background: #ffd21c;
}


/* نور داخل جعبه */

.gift-glow {
    position: absolute;

    left: 50%;
    top: 12px;

    width: 30px;
    height: 20px;

    transform: translateX(-50%);

    background: #fff;

    border-radius: 50%;

    filter: blur(8px);

    opacity: 0;

    animation: giftLight 3.6s infinite;
}


/* =====================================================
   COINS
===================================================== */

.coin {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffbd0,
            #ffe23b 35%,
            #ffae00 75%,
            #d87b00
        );

    border: 1px solid #fff4a0;

    box-shadow:
        0 0 6px #ffd21c,
        0 0 16px #ffae00;

    opacity: 0;

    animation: coinBurst 3.6s infinite;
}


.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #a76500;

    font-size: 8px;
    font-weight: 900;
}


/* =====================================================
   SPARKS
===================================================== */

.spark {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 5px #fff,
        0 0 12px #00ff88,
        0 0 20px #fff;

    opacity: 0;

    animation: sparkBurst 3.6s infinite;
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 6px;
    height: 13px;

    border-radius: 2px;

    opacity: 0;

    animation: confettiBurst 3.6s infinite;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes giftAppear {

    0%, 52%, 100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.25)
            rotate(-12deg);
    }

    8% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.25)
            rotate(5deg);
    }

    16% {
        transform:
            translate(-50%, -50%)
            scale(.92)
            rotate(-3deg);
    }

    25% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0);
    }

    48% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.05);
    }
}


@keyframes lidOpen {

    0%, 8% {
        transform:
            rotate(0deg)
            translateY(0);
    }

    18%, 48% {
        transform:
            rotate(-32deg)
            translate(-4px, -13px);
    }

    55%, 100% {
        transform:
            rotate(0deg)
            translateY(0);
    }
}


@keyframes giftLight {

    0%, 15%, 100% {
        opacity: 0;
        transform: translateX(-50%) scale(.3);
    }

    20% {
        opacity: 1;
        transform: translateX(-50%) scale(1.7);
    }

    35% {
        opacity: .8;
        transform: translateX(-50%) scale(1.1);
    }

    50% {
        opacity: 0;
    }
}


@keyframes coinBurst {

    0%, 8% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0)
            scale(.3);
    }

    15% {
        opacity: 1;
    }

    58% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(var(--x), var(--y))
            rotate(720deg)
            scale(1.15);
    }
}


@keyframes sparkBurst {

    0%, 10% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    18% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(var(--x), var(--y))
            scale(1.8);
    }
}


@keyframes confettiBurst {

    0%, 8% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(var(--x), var(--y))
            rotate(720deg);
    }
}


/* =====================================================
   POSITIONS
===================================================== */

.coin:nth-child(3) {
    --x: -145px;
    --y: -55px;
}

.coin:nth-child(4) {
    --x: 150px;
    --y: -70px;
}

.coin:nth-child(5) {
    --x: -105px;
    --y: 50px;
}

.coin:nth-child(6) {
    --x: 115px;
    --y: 55px;
}


/* Sparks */

.spark:nth-child(7) {
    --x: -155px;
    --y: -65px;
}

.spark:nth-child(8) {
    --x: 160px;
    --y: -80px;
}

.spark:nth-child(9) {
    --x: -135px;
    --y: 70px;
}

.spark:nth-child(10) {
    --x: 140px;
    --y: 80px;
}


/* Confetti */

.confetti:nth-child(11) {
    --x: -175px;
    --y: -85px;
    background: #ff315d;
}

.confetti:nth-child(12) {
    --x: -80px;
    --y: -110px;
    background: #ffd21c;
}

.confetti:nth-child(13) {
    --x: 80px;
    --y: -115px;
    background: #00ff88;
}

.confetti:nth-child(14) {
    --x: 175px;
    --y: -80px;
    background: #8c52ff;
}

.confetti:nth-child(15) {
    --x: -160px;
    --y: 95px;
    background: #00d9ff;
}

.confetti:nth-child(16) {
    --x: 160px;
    --y: 100px;
    background: #ff6b00;
}


/* =====================================================
   GREEN BREATH
===================================================== */

@keyframes greenBreath {

    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.04);
    }
}


@keyframes scanGreen {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(325px);
        opacity: .95;
    }

    31%, 100% {
        transform: translateX(325px);
        opacity: .12;
    }
}


@keyframes scanGreenReverse {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(-325px);
        opacity: .95;
    }

    31%, 100% {
        transform: translateX(-325px);
        opacity: .12;
    }
}

</style>
</head>


<body>

<!-- COPY TRADE PANEL -->
<div class="copy-trade-panel">
    <div class="copy-trade-text" id="copyTradeBalance"></div>
</div>


<!-- =================================================
     پنل بالایی
================================================= -->

<div class="webcam-panel">

    <div class="celebration">

        <div class="gift">

            <div class="gift-glow"></div>
            <div class="gift-lid"></div>
            <div class="gift-box"></div>
            <div class="gift-ribbon-v"></div>
            <div class="gift-ribbon-h"></div>

        </div>

        <div class="coin"></div>
        <div class="coin"></div>
        <div class="coin"></div>
        <div class="coin"></div>

        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>

        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>

    </div>

</div>


<!-- =================================================
     پنل پایینی اصلی
     هیچ جشن یا افکتی داخلش نیست
================================================= -->

<div class="webcam-frame"></div>


<script>

/* فقط عدد Copy Trade */
const copyTradeBalance = 10000;

document.getElementById("copyTradeBalance").textContent =
    "TOTAL BALANCE COPY TRADE: $" +
    copyTradeBalance.toLocaleString("en-US");

</script>

</body>
</html>
