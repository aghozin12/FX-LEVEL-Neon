<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
}

/* =========================================================
   ONLY EFFECT AREA
   x = 40 → 470
   y = 480 → 691

   Completely invisible.
   No border / background / shadow.
   ========================================================= */

#celebration {
    position: absolute;
    left: 40px;
    top: 480px;
    width: 430px;
    height: 211px;

    overflow: hidden;

    pointer-events: none;
    background: transparent;
}

/* =========================================================
   CANVAS
   ========================================================= */

#fx {
    position: absolute;
    inset: 0;

    width: 430px;
    height: 211px;

    display: block;

    pointer-events: none;
}

/* =========================================================
   GIFT
   ========================================================= */

#gift {
    position: absolute;

    left: 50%;
    top: 7px;

    width: 58px;
    height: 51px;

    transform:
        translateX(-50%)
        scale(.75);

    opacity: 0;

    z-index: 10;

    filter:
        drop-shadow(0 4px 8px rgba(0,0,0,.25))
        drop-shadow(0 0 10px rgba(255,190,40,.25));

    transform-origin: 50% 100%;
}

/* Box */

.gift-body {
    position: absolute;

    left: 5px;
    bottom: 0;

    width: 48px;
    height: 34px;

    border-radius: 3px 3px 6px 6px;

    background:
        linear-gradient(
            90deg,
            #b70e20 0%,
            #ed263b 35%,
            #ff3c4d 52%,
            #c50f22 100%
        );

    box-shadow:
        inset 0 2px rgba(255,255,255,.16),
        inset 0 -4px rgba(0,0,0,.15);
}

/* Vertical ribbon */

.gift-body::before {
    content: "";

    position: absolute;

    left: 19px;
    top: 0;

    width: 10px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #d99c0d,
            #ffe15a,
            #fff2a0,
            #d99c0d
        );
}

/* Lid */

.gift-lid {
    position: absolute;

    left: 1px;
    top: 8px;

    width: 56px;
    height: 11px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #c71124,
            #ff4050,
            #c71124
        );

    transform-origin: 7px 100%;
}

/* Lid ribbon */

.gift-lid::after {
    content: "";

    position: absolute;

    left: 22px;
    top: 0;

    width: 10px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #d99c0d,
            #ffe15a,
            #fff0a0,
            #d99c0d
        );
}

/* Bow */

.bow {
    position: absolute;

    left: 50%;
    top: -2px;

    width: 30px;
    height: 17px;

    transform: translateX(-50%);
}

.bow span {
    position: absolute;

    top: 2px;

    width: 16px;
    height: 11px;

    background:
        linear-gradient(
            135deg,
            #fff18a,
            #ffc928,
            #d99b0b
        );

    border-radius: 80% 20% 70% 30%;
}

.bow .left {
    left: 0;
    transform: rotate(24deg);
}

.bow .right {
    right: 0;
    transform:
        scaleX(-1)
        rotate(24deg);
}

.bow .center {
    left: 11px;
    top: 5px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff9bc,
            #ffd52f 55%,
            #d89500
        );
}

/* =========================================================
   GIFT ANIMATION STATES
   Controlled by JS
   ========================================================= */

#gift.show {
    animation: giftAppear .65s cubic-bezier(.18,.9,.25,1.25) forwards;
}

#gift.shake {
    animation: giftShake .5s ease-in-out;
}

#gift.explode {
    animation: giftDisappear .32s ease-out forwards;
}

#gift.explode .gift-lid {
    animation: lidOpen .34s cubic-bezier(.2,.9,.25,1) forwards;
}

@keyframes giftAppear {

    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(12px)
            scale(.55)
            rotate(-5deg);
    }

    65% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(-2px)
            scale(1.06)
            rotate(1deg);
    }

    100% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0);
    }
}

@keyframes giftShake {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0);
    }

    20% {
        transform:
            translateX(calc(-50% - 3px))
            rotate(-4deg)
            scale(1.02);
    }

    40% {
        transform:
            translateX(calc(-50% + 3px))
            rotate(4deg)
            scale(1.04);
    }

    60% {
        transform:
            translateX(calc(-50% - 2px))
            rotate(-3deg)
            scale(1.02);
    }

    80% {
        transform:
            translateX(calc(-50% + 2px))
            rotate(2deg)
            scale(1.03);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(0)
            scale(1);
    }
}

@keyframes lidOpen {

    0% {
        transform:
            rotate(0)
            translateY(0);
    }

    45% {
        transform:
            rotate(-18deg)
            translateY(-3px);
    }

    100% {
        transform:
            rotate(-55deg)
            translateY(-11px);
    }
}

@keyframes giftDisappear {

    0% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(1.18);
    }
}
</style>
</head>

<body>

<div id="celebration">

    <canvas id="fx" width="860" height="422"></canvas>

    <div id="gift">

        <div class="gift-lid"></div>

        <div class="bow">
            <span class="left"></span>
            <span class="right"></span>
            <span class="center"></span>
        </div>

        <div class="gift-body"></div>

    </div>

</div>

<script>
/* =========================================================
   PROFESSIONAL GIFT CELEBRATION
   ========================================================= */

const scene = document.getElementById("celebration");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const gift = document.getElementById("gift");

const W = 430;
const H = 211;

const DPR = 2;

let particles = [];
let sparks = [];
let rings = [];

let running = false;
let raf = null;


/* =========================================================
   HELPERS
   ========================================================= */

const random = (min, max) =>
    Math.random() * (max - min) + min;

const clamp = (v, min, max) =>
    Math.max(min, Math.min(max, v));

const easeOutCubic = t =>
    1 - Math.pow(1 - t, 3);


/* =========================================================
   PARTICLE CLASS
   ========================================================= */

class Particle {

    constructor(type, x, y) {

        this.type = type;

        this.x = x;
        this.y = y;

        /*
         * Strong initial upward velocity.
         *
         * Each particle gets a different angle.
         */
        const angle = random(
            Math.PI * 1.18,
            Math.PI * 1.82
        );

        const speed =
            type === "coin"
                ? random(145, 220)
                : random(115, 185);

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        /*
         * Gravity.
         */
        this.gravity =
            type === "coin"
                ? random(260, 330)
                : random(190, 260);

        /*
         * Air resistance.
         */
        this.drag =
            type === "coin"
                ? random(.992, .997)
                : random(.988, .995);

        this.size =
            type === "coin"
                ? random(7, 11)
                : random(4, 8);

        this.rotation =
            random(0, Math.PI * 2);

        this.rotationSpeed =
            random(-12, 12);

        this.life = 0;

        this.maxLife =
            type === "coin"
                ? random(2.0, 2.7)
                : random(1.7, 2.4);

        /*
         * Horizontal floating/wobble.
         */
        this.wave = random(0, Math.PI * 2);
        this.waveSpeed = random(2.5, 5.5);
        this.waveAmount = random(3, 12);

        this.alpha = 1;
    }


    update(dt) {

        this.life += dt;

        /*
         * First: explosive launch.
         *
         * Then gravity gradually dominates.
         */
        this.vy += this.gravity * dt;

        this.vx *= Math.pow(this.drag, dt * 60);

        this.vy *= Math.pow(this.drag, dt * 30);

        this.x += this.vx * dt;

        /*
         * Natural side-to-side movement.
         */
        this.x +=
            Math.sin(
                this.life * this.waveSpeed +
                this.wave
            ) *
            this.waveAmount *
            dt;

        this.y += this.vy * dt;

        this.rotation +=
            this.rotationSpeed * dt;

        /*
         * Fade only near the end.
         */
        if (this.life > this.maxLife - .45) {

            this.alpha =
                clamp(
                    (this.maxLife - this.life) / .45,
                    0,
                    1
                );
        }

        /*
         * Hard safety boundary.
         *
         * Particles can NEVER enter
         * the lower area.
         */
        if (this.y > H - 5) {

            this.y = H - 5;
            this.vy *= -.15;
            this.alpha *= .75;
        }

        return this.life < this.maxLife;
    }


    draw(ctx) {

        ctx.save();

        ctx.globalAlpha = this.alpha;

        ctx.translate(this.x, this.y);

        ctx.rotate(this.rotation);

        if (this.type === "coin") {

            this.drawCoin(ctx);

        } else if (this.type === "confetti") {

            this.drawConfetti(ctx);

        } else {

            this.drawSpark(ctx);
        }

        ctx.restore();
    }


    drawCoin(ctx) {

        /*
         * Fake 3D coin:
         * width changes during rotation.
         */
        const spin =
            Math.abs(Math.cos(this.rotation * .7));

        const width =
            this.size * (.35 + spin * .65);

        const height =
            this.size * 1.15;

        const gradient =
            ctx.createRadialGradient(
                -width * .25,
                -height * .3,
                1,
                0,
                0,
                height
            );

        gradient.addColorStop(0, "#fff7a8");
        gradient.addColorStop(.35, "#ffd83d");
        gradient.addColorStop(.75, "#e9a817");
        gradient.addColorStop(1, "#a96700");

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            width,
            height,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            "rgba(255,245,160,.9)";

        ctx.lineWidth = 1;

        ctx.stroke();

        /*
         * Dollar mark.
         */
        ctx.scale(
            Math.max(.25, spin),
            1
        );

        ctx.fillStyle =
            "rgba(125,75,0,.7)";

        ctx.font =
            `bold ${Math.max(6,this.size*.72)}px Arial`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText("$", 0, 0);
    }


    drawConfetti(ctx) {

        ctx.fillStyle =
            this.color || "#ffd43b";

        ctx.fillRect(
            -this.size / 2,
            -this.size,
            this.size,
            this.size * 2.2
        );
    }


    drawSpark(ctx) {

        const s = this.size;

        ctx.fillStyle =
            "rgba(255,245,165,.95)";

        ctx.shadowColor =
            "rgba(255,215,50,.95)";

        ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.moveTo(0, -s * 1.8);
        ctx.lineTo(s * .35, -s * .35);
        ctx.lineTo(s * 1.8, 0);
        ctx.lineTo(s * .35, s * .35);
        ctx.lineTo(0, s * 1.8);
        ctx.lineTo(-s * .35, s * .35);
        ctx.lineTo(-s * 1.8, 0);
        ctx.lineTo(-s * .35, -s * .35);

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   CREATE EXPLOSION
   ========================================================= */

function createExplosion() {

    /*
     * Coins
     */
    for (let i = 0; i < 15; i++) {

        const p =
            new Particle(
                "coin",
                W / 2 + random(-5, 5),
                34 + random(-3, 3)
            );

        particles.push(p);
    }


    /*
     * Confetti
     */
    const colors = [
        "#ff5264",
        "#ffd438",
        "#4ddfff",
        "#77ef78",
        "#c47cff",
        "#ffffff"
    ];

    for (let i = 0; i < 16; i++) {

        const p =
            new Particle(
                "confetti",
                W / 2 + random(-4, 4),
                34 + random(-3, 3)
            );

        p.color =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        p.size = random(4, 7);

        p.maxLife =
            random(1.8, 2.7);

        particles.push(p);
    }


    /*
     * Fast sparks.
     */
    for (let i = 0; i < 18; i++) {

        const p =
            new Particle(
                "spark",
                W / 2 + random(-3, 3),
                34
            );

        p.maxLife =
            random(.65, 1.2);

        p.gravity =
            random(100, 180);

        p.vx *= random(.75, 1.3);
        p.vy *= random(.75, 1.15);

        sparks.push(p);
    }


    /*
     * Explosion rings.
     */
    rings.push({
        x: W / 2,
        y: 34,
        radius: 4,
        alpha: .8,
        life: 0,
        maxLife: .45
    });

    rings.push({
        x: W / 2,
        y: 34,
        radius: 3,
        alpha: .45,
        life: 0,
        maxLife: .7
    });
}


/* =========================================================
   RENDER
   ========================================================= */

let previous = performance.now();

function render(now) {

    const dt =
        Math.min(
            (now - previous) / 1000,
            .033
        );

    previous = now;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
     * Canvas is 2x for sharp OBS rendering.
     */
    ctx.save();

    ctx.scale(DPR, DPR);

    /*
     * Main particles.
     */
    particles =
        particles.filter(
            p => {

                const alive =
                    p.update(dt);

                if (alive) {
                    p.draw(ctx);
                }

                return alive;
            }
        );


    /*
     * Sparks.
     */
    sparks =
        sparks.filter(
            p => {

                const alive =
                    p.update(dt);

                if (alive) {
                    p.draw(ctx);
                }

                return alive;
            }
        );


    /*
     * Explosion rings.
     */
    rings =
        rings.filter(
            ring => {

                ring.life += dt;

                const t =
                    ring.life /
                    ring.maxLife;

                ring.radius +=
                    150 * dt;

                ring.alpha =
                    .8 * (1 - t);

                if (ring.alpha > 0) {

                    ctx.beginPath();

                    ctx.arc(
                        ring.x,
                        ring.y,
                        ring.radius,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        `rgba(255,220,70,${ring.alpha})`;

                    ctx.lineWidth =
                        2.5 * (1 - t);

                    ctx.shadowColor =
                        "rgba(255,200,30,.8)";

                    ctx.shadowBlur = 10;

                    ctx.stroke();
                }

                return ring.life < ring.maxLife;
            }
        );

    ctx.restore();

    raf =
        requestAnimationFrame(render);
}


/* =========================================================
   GIFT CYCLE
   ========================================================= */

function resetGift() {

    gift.classList.remove(
        "show",
        "shake",
        "explode"
    );

    /*
     * Force animation reset.
     */
    void gift.offsetWidth;

    gift.classList.add("show");
}


function playCelebration() {

    if (running) return;

    running = true;

    /*
     * Clean previous particles.
     */
    particles.length = 0;
    sparks.length = 0;
    rings.length = 0;

    resetGift();


    /*
     * Gift stays visible.
     */
    setTimeout(() => {

        gift.classList.add("shake");

    }, 2400);


    /*
     * Explosion.
     */
    setTimeout(() => {

        gift.classList.remove("shake");

        gift.classList.add("explode");

        createExplosion();

    }, 2920);


    /*
     * Wait before next celebration.
     *
     * This prevents the animation
     * from feeling repetitive.
     */
    setTimeout(() => {

        running = false;

        playCelebration();

    }, 8200);
}


/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(render);

setTimeout(() => {

    playCelebration();

}, 700);

</script>

</body>
</html>
