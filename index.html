<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html,
body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

/* =========================================================
   فقط محدوده‌ی افکت‌ها — کاملاً نامرئی
   ========================================================= */

.effect-top,
.effect-middle {
    position: absolute;
    left: 40px;
    width: 430px;
    overflow: hidden;
    pointer-events: none;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
}

/* محدوده اول */
.effect-top {
    bottom: 539px;
    height: 55px;
}

/* محدوده دوم */
.effect-middle {
    bottom: 389px;
    height: 140px;
}


/* =========================================================
   TOP AREA
   🎁 Gift Burst
   ========================================================= */

.top-gift {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 32px;
    height: 28px;
    transform: translate(-50%, -50%) scale(.2);
    opacity: 0;

    animation: topGift 4.6s ease-in-out infinite;
}

/* جعبه */
.top-gift-box {
    position: absolute;
    left: 3px;
    bottom: 0;
    width: 26px;
    height: 19px;

    background: linear-gradient(
        90deg,
        #ff1744,
        #ff4081,
        #ff1744
    );

    border-radius: 3px;

    box-shadow:
        0 0 8px rgba(255, 23, 68, .9),
        0 0 18px rgba(255, 23, 68, .5);
}

/* درب */
.top-gift-lid {
    position: absolute;
    left: 1px;
    top: 3px;
    width: 30px;
    height: 7px;

    background: linear-gradient(
        90deg,
        #ff4081,
        #ff80ab,
        #ff4081
    );

    border-radius: 3px;

    transform-origin: left bottom;

    animation: topLid 4.6s ease-in-out infinite;
}

/* روبان عمودی */
.top-gift-ribbon {
    position: absolute;
    left: 13px;
    top: 3px;
    width: 5px;
    height: 25px;

    background: #ffd740;

    box-shadow:
        0 0 7px #ffd740;
}

/* روبان افقی */
.top-gift-ribbon2 {
    position: absolute;
    left: 3px;
    top: 10px;
    width: 26px;
    height: 4px;

    background: #ffd740;
}


/* =========================================================
   TOP COINS
   ========================================================= */

.top-coin {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff8a6,
            #ffd740 45%,
            #ff9800
        );

    box-shadow:
        0 0 5px #ffd740,
        0 0 10px rgba(255, 193, 7, .7);

    opacity: 0;

    animation: topCoin 4.6s ease-out infinite;
}

.top-coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 5px;
    font-weight: bold;
    color: #8d5a00;
}


/* مسیر سکه‌ها */

.top-coin:nth-of-type(2) {
    --tx: -145px;
    --ty: -16px;
}

.top-coin:nth-of-type(3) {
    --tx: -85px;
    --ty: 17px;
}

.top-coin:nth-of-type(4) {
    --tx: 85px;
    --ty: -15px;
}

.top-coin:nth-of-type(5) {
    --tx: 145px;
    --ty: 16px;
}


/* =========================================================
   TOP SPARKS
   ========================================================= */

.top-spark {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 5px #fff,
        0 0 10px #ffd740;

    opacity: 0;

    animation: topSpark 4.6s ease-out infinite;
}

.top-spark:nth-of-type(6) {
    --sx: -105px;
    --sy: -22px;
}

.top-spark:nth-of-type(7) {
    --sx: 105px;
    --sy: -22px;
}

.top-spark:nth-of-type(8) {
    --sx: -120px;
    --sy: 22px;
}

.top-spark:nth-of-type(9) {
    --sx: 120px;
    --sy: 22px;
}


/* =========================================================
   TOP LIGHT FLASH
   ========================================================= */

.top-flash {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform: translate(-50%, -50%) scale(.1);

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(255,255,255,.9) 0%,
        rgba(255,215,64,.35) 25%,
        transparent 70%
    );

    opacity: 0;

    animation: topFlash 4.6s infinite;
}


/* =========================================================
   MIDDLE AREA
   🎉 CONFETTI PARTY
   ========================================================= */

.middle-burst {
    position: absolute;

    left: 50%;
    top: 52%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 16px #ffd740;

    animation: middleBurst 5.2s ease-out infinite;

    opacity: 0;
}


/* =========================================================
   MIDDLE COINS
   ========================================================= */

.middle-coin {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0,
            #ffd740 40%,
            #f57c00 100%
        );

    border: 1px solid rgba(255,255,255,.65);

    box-shadow:
        0 0 8px #ffd740,
        0 0 18px rgba(255,193,7,.7);

    opacity: 0;

    animation: middleCoin 5.2s ease-out infinite;
}

.middle-coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 8px;
    font-weight: bold;

    color: #8d5a00;
}


/* مسیرهای متفاوت */

.middle-coin:nth-of-type(2) {
    --mx: -175px;
    --my: -45px;
    --rot: 520deg;
}

.middle-coin:nth-of-type(3) {
    --mx: -125px;
    --my: 42px;
    --rot: -430deg;
}

.middle-coin:nth-of-type(4) {
    --mx: 125px;
    --my: -40px;
    --rot: 480deg;
}

.middle-coin:nth-of-type(5) {
    --mx: 175px;
    --my: 45px;
    --rot: -520deg;
}

.middle-coin:nth-of-type(6) {
    --mx: 0px;
    --my: -58px;
    --rot: 360deg;
}


/* =========================================================
   CONFETTI
   ========================================================= */

.confetti {
    position: absolute;

    left: 50%;
    top: 48%;

    width: 5px;
    height: 13px;

    border-radius: 1px;

    opacity: 0;

    animation: confettiFall 5.2s linear infinite;
}

/* رنگ‌ها */
.confetti:nth-of-type(7) {
    background: #ff4081;
    --cx: -190px;
    --cy: 100px;
    --cr: 480deg;
}

.confetti:nth-of-type(8) {
    background: #ffd740;
    --cx: -145px;
    --cy: 90px;
    --cr: -540deg;
}

.confetti:nth-of-type(9) {
    background: #40c4ff;
    --cx: -80px;
    --cy: 105px;
    --cr: 620deg;
}

.confetti:nth-of-type(10) {
    background: #69f0ae;
    --cx: 80px;
    --cy: 100px;
    --cr: -580deg;
}

.confetti:nth-of-type(11) {
    background: #ff5252;
    --cx: 145px;
    --cy: 90px;
    --cr: 500deg;
}

.confetti:nth-of-type(12) {
    background: #7c4dff;
    --cx: 190px;
    --cy: 105px;
    --cr: -620deg;
}

.confetti:nth-of-type(13) {
    background: #fff;
    --cx: -55px;
    --cy: 75px;
    --cr: 450deg;
}

.confetti:nth-of-type(14) {
    background: #ffab40;
    --cx: 55px;
    --cy: 78px;
    --cr: -470deg;
}


/* =========================================================
   MIDDLE SPARK RING
   ========================================================= */

.ring-spark {
    position: absolute;

    left: 50%;
    top: 52%;

    width: 4px;
    height: 4px;

    background: #fff;

    border-radius: 50%;

    box-shadow:
        0 0 7px #fff,
        0 0 14px #ffd740;

    opacity: 0;

    animation: ringSpark 5.2s ease-out infinite;
}

.ring-spark:nth-of-type(15) {
    --rx: -155px;
    --ry: -55px;
}

.ring-spark:nth-of-type(16) {
    --rx: 155px;
    --ry: -55px;
}

.ring-spark:nth-of-type(17) {
    --rx: -165px;
    --ry: 55px;
}

.ring-spark:nth-of-type(18) {
    --rx: 165px;
    --ry: 55px;
}

.ring-spark:nth-of-type(19) {
    --rx: -95px;
    --ry: 65px;
}

.ring-spark:nth-of-type(20) {
    --rx: 95px;
    --ry: 65px;
}


/* =========================================================
   TOP ANIMATIONS
   ========================================================= */

@keyframes topGift {

    0%, 8% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.15);
    }

    16% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.85);
    }

    23% {
        transform: translate(-50%, -50%) scale(1);
    }

    35% {
        transform: translate(-50%, -50%) scale(.9);
    }

    45%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
    }
}

@keyframes topLid {

    0%, 18% {
        transform: rotate(0deg) translateY(0);
    }

    25% {
        transform: rotate(-32deg) translate(-4px, -5px);
    }

    42% {
        transform: rotate(-32deg) translate(-4px, -5px);
    }

    52%, 100% {
        transform: rotate(0deg);
    }
}

@keyframes topCoin {

    0%, 20% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    28% {
        opacity: 1;
    }

    58% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--tx)),
                calc(-50% + var(--ty))
            )
            scale(1);
    }

    82% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--tx)),
                calc(-50% + var(--ty))
            )
            scale(.55)
            rotate(300deg);
    }

    100% {
        opacity: 0;
    }
}

@keyframes topSpark {

    0%, 22% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1);
    }

    35% {
        opacity: 1;
    }

    60% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--sx)),
                calc(-50% + var(--sy))
            )
            scale(1.3);
    }

    82% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--sx)),
                calc(-50% + var(--sy))
            )
            scale(.2);
    }

    100% {
        opacity: 0;
    }
}

@keyframes topFlash {

    0%, 18% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1);
    }

    27% {
        opacity: .8;
        transform: translate(-50%, -50%) scale(1);
    }

    40% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.7);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   MIDDLE ANIMATIONS
   ========================================================= */

@keyframes middleBurst {

    0%, 8% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1);
    }

    18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.4);
    }

    45% {
        opacity: .8;
        transform: translate(-50%, -50%) scale(1);
    }

    70%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
    }
}

@keyframes middleCoin {

    0%, 10% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.15)
            rotate(0deg);
    }

    18% {
        opacity: 1;
    }

    55% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--mx)),
                calc(-50% + var(--my))
            )
            scale(1)
            rotate(var(--rot));
    }

    78% {
        opacity: .7;
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--mx)),
                calc(-50% + var(--my))
            )
            scale(.3)
            rotate(var(--rot));
    }
}

@keyframes confettiFall {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translateY(-15px)
            rotate(0deg);
    }

    12% {
        opacity: 1;
    }

    75% {
        opacity: .9;
        transform:
            translate(
                calc(-50% + var(--cx)),
                calc(-50% + var(--cy))
            )
            rotate(var(--cr));
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--cx)),
                calc(-50% + var(--cy))
            )
            rotate(calc(var(--cr) + 180deg));
    }
}

@keyframes ringSpark {

    0%, 12% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1);
    }

    25% {
        opacity: 1;
    }

    60% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--rx)),
                calc(-50% + var(--ry))
            )
            scale(1.5);
    }

    85%, 100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--rx)),
                calc(-50% + var(--ry))
            )
            scale(.2);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     ناحیه اول
     🎁 Gift Explosion
     ===================================================== -->

<div class="effect-top">

    <div class="top-flash"></div>

    <div class="top-gift">
        <div class="top-gift-box"></div>
        <div class="top-gift-lid"></div>
        <div class="top-gift-ribbon"></div>
        <div class="top-gift-ribbon2"></div>
    </div>

    <div class="top-coin"></div>
    <div class="top-coin"></div>
    <div class="top-coin"></div>
    <div class="top-coin"></div>

    <div class="top-spark"></div>
    <div class="top-spark"></div>
    <div class="top-spark"></div>
    <div class="top-spark"></div>

</div>


<!-- =====================================================
     ناحیه دوم
     🎉 Confetti Party
     ===================================================== -->

<div class="effect-middle">

    <div class="middle-burst"></div>

    <div class="middle-coin"></div>
    <div class="middle-coin"></div>
    <div class="middle-coin"></div>
    <div class="middle-coin"></div>
    <div class="middle-coin"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="ring-spark"></div>
    <div class="ring-spark"></div>
    <div class="ring-spark"></div>
    <div class="ring-spark"></div>
    <div class="ring-spark"></div>
    <div class="ring-spark"></div>

</div>

</body>
</html>
