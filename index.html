<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

html,
body {
    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;
}


/* =====================================================
   دو محدوده نامرئی فقط برای محدود کردن افکت
   هیچ قاب، رنگ یا Border ندارند
===================================================== */

.top-effect {
    position: absolute;

    left: 40px;
    bottom: 539px;

    width: 430px;
    height: 55px;

    overflow: hidden;

    pointer-events: none;
}


.middle-effect {
    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    overflow: hidden;

    pointer-events: none;
}


/* =====================================================
   CENTER FLASH
===================================================== */

.flash {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px #fff,
        0 0 45px #00ff88,
        0 0 70px #00ff88;

    transform: translate(-50%, -50%) scale(0);

    opacity: 0;

    animation: flash 3.8s infinite;
}


/* =====================================================
   GIFT
===================================================== */

.gift {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 64px;
    height: 58px;

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;

    z-index: 5;

    filter:
        drop-shadow(0 0 8px #ff2670)
        drop-shadow(0 0 20px #ff0066)
        drop-shadow(0 0 35px rgba(255,0,100,.8));

    animation:
        giftShow 3.8s
        cubic-bezier(.2,.8,.2,1)
        infinite;
}


/* Gift box */

.gift-box {
    position: absolute;

    left: 6px;
    bottom: 0;

    width: 52px;
    height: 37px;

    border-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #ff4775 0%,
            #ff005d 50%,
            #b90045 100%
        );

    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.35);
}


/* Gift lid */

.gift-lid {
    position: absolute;

    left: 1px;
    top: 9px;

    width: 62px;
    height: 12px;

    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            #ff174f,
            #ff5a83,
            #ff174f
        );

    transform-origin: left bottom;

    animation: lid 3.8s infinite;

    z-index: 3;
}


/* Vertical ribbon */

.gift-ribbon-v {
    position: absolute;

    left: 27px;
    top: 8px;

    width: 9px;
    height: 48px;

    background:
        linear-gradient(
            90deg,
            #ffb800,
            #fff06a,
            #ffb800
        );

    box-shadow:
        0 0 7px #ffd21c;

    z-index: 4;
}


/* Horizontal ribbon */

.gift-ribbon-h {
    position: absolute;

    left: 6px;
    top: 24px;

    width: 52px;
    height: 7px;

    background:
        linear-gradient(
            90deg,
            #ffb800,
            #fff06a,
            #ffb800
        );

    z-index: 4;
}


/* Bow */

.gift-bow-left,
.gift-bow-right {

    position: absolute;

    top: -2px;

    width: 25px;
    height: 17px;

    background: #ffd21c;

    border-radius: 70% 20% 70% 20%;

    box-shadow:
        0 0 7px #ffd21c;
}

.gift-bow-left {
    left: 9px;

    transform: rotate(-30deg);
}

.gift-bow-right {
    right: 9px;

    transform: rotate(30deg);
}


/* =====================================================
   COINS
===================================================== */

.coin {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0,
            #ffe43b 35%,
            #ffb000 70%,
            #d87800
        );

    border: 1px solid #fff4a0;

    box-shadow:
        0 0 6px #ffe14a,
        0 0 14px #ffae00,
        0 0 22px rgba(255,180,0,.8);

    opacity: 0;

    animation: coin 3.8s ease-out infinite;
}

.coin::after {

    content: "$";

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #9c5d00;

    font-size: 8px;

    font-weight: 900;
}


/* =====================================================
   SPARKS
===================================================== */

.spark {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 12px #00ff88,
        0 0 22px white;

    opacity: 0;

    animation: spark 3.8s ease-out infinite;
}


/* =====================================================
   STAR RAYS
===================================================== */

.ray {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 3px;
    height: 35px;

    background:
        linear-gradient(
            to top,
            transparent,
            white,
            #00ff88
        );

    transform-origin: bottom center;

    opacity: 0;

    animation: ray 3.8s infinite;
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 13px;

    border-radius: 2px;

    opacity: 0;

    animation: confetti 3.8s linear infinite;
}


/* =====================================================
   GIFT ANIMATION
===================================================== */

@keyframes giftShow {

    0%,
    48%,
    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2)
            rotate(-12deg);
    }

    7% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.25)
            rotate(6deg);
    }

    13% {

        transform:
            translate(-50%, -50%)
            scale(.92)
            rotate(-3deg);
    }

    20% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0);
    }

    43% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08)
            rotate(0);
    }
}


/* =====================================================
   LID
===================================================== */

@keyframes lid {

    0%,
    8% {

        transform:
            rotate(0)
            translate(0,0);
    }

    15%,
    43% {

        transform:
            rotate(-34deg)
            translate(-5px,-15px);
    }

    52%,
    100% {

        transform:
            rotate(0)
            translate(0,0);
    }
}


/* =====================================================
   FLASH
===================================================== */

@keyframes flash {

    0%,
    12% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    17% {

        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    28% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(3.8);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   COINS
===================================================== */

@keyframes coin {

    0%,
    10% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(.3)
            rotate(0);
    }

    17% {
        opacity: 1;
    }

    62% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(1.15)
            rotate(900deg);
    }
}


/* =====================================================
   SPARKS
===================================================== */

@keyframes spark {

    0%,
    10% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(.2);
    }

    16% {
        opacity: 1;
    }

    55% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(1.8);
    }
}


/* =====================================================
   RAYS
===================================================== */

@keyframes ray {

    0%,
    10% {

        opacity: 0;

        transform:
            translate(-50%,-100%)
            rotate(var(--angle))
            scaleY(.2);
    }

    17% {
        opacity: 1;
    }

    35% {

        opacity: .8;

        transform:
            translate(-50%,-100%)
            rotate(var(--angle))
            scaleY(1);
    }

    50% {
        opacity: 0;
    }
}


/* =====================================================
   CONFETTI
===================================================== */

@keyframes confetti {

    0%,
    10% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(0,0)
            rotate(0);
    }

    16% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            rotate(900deg);
    }
}


/* =====================================================
   COIN POSITIONS
===================================================== */

.coin:nth-child(3) {
    --x: -170px;
    --y: -35px;
}

.coin:nth-child(4) {
    --x: 170px;
    --y: -40px;
}

.coin:nth-child(5) {
    --x: -125px;
    --y: 35px;
}

.coin:nth-child(6) {
    --x: 125px;
    --y: 40px;
}


/* =====================================================
   SPARK POSITIONS
===================================================== */

.spark:nth-child(7) {
    --x: -175px;
    --y: -45px;
}

.spark:nth-child(8) {
    --x: 175px;
    --y: -50px;
}

.spark:nth-child(9) {
    --x: -145px;
    --y: 45px;
}

.spark:nth-child(10) {
    --x: 145px;
    --y: 50px;
}


/* =====================================================
   RAYS
===================================================== */

.ray:nth-child(11) {
    --angle: 0deg;
}

.ray:nth-child(12) {
    --angle: 45deg;
}

.ray:nth-child(13) {
    --angle: 90deg;
}

.ray:nth-child(14) {
    --angle: 135deg;
}

.ray:nth-child(15) {
    --angle: 180deg;
}

.ray:nth-child(16) {
    --angle: 225deg;
}

.ray:nth-child(17) {
    --angle: 270deg;
}

.ray:nth-child(18) {
    --angle: 315deg;
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti:nth-child(19) {
    --x: -190px;
    --y: -40px;
    background: #ff315d;
}

.confetti:nth-child(20) {
    --x: -120px;
    --y: -70px;
    background: #ffd21c;
}

.confetti:nth-child(21) {
    --x: -50px;
    --y: -85px;
    background: #00ff88;
}

.confetti:nth-child(22) {
    --x: 55px;
    --y: -85px;
    background: #8c52ff;
}

.confetti:nth-child(23) {
    --x: 125px;
    --y: -65px;
    background: #00d9ff;
}

.confetti:nth-child(24) {
    --x: 190px;
    --y: -35px;
    background: #ff6600;
}


/* =====================================================
   COPY TRADE AREA
   کوچکتر است، پس افکت کمی جمع‌وجورتر می‌شود
===================================================== */

.top-effect .gift {
    transform:
        translate(-50%, -50%)
        scale(.65);
}

.top-effect .coin {
    transform:
        translate(-50%, -50%)
        scale(.75);
}

.top-effect .spark {
    transform:
        translate(-50%, -50%)
        scale(.7);
}

</style>
</head>


<body>


<!-- =================================================
     جشن ناحیه بالایی
================================================= -->

<div class="top-effect">

    <div class="flash"></div>

    <div class="gift">

        <div class="gift-box"></div>
        <div class="gift-lid"></div>

        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>

        <div class="gift-bow-left"></div>
        <div class="gift-bow-right"></div>

    </div>


    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>


    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>


    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>


    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

</div>



<!-- =================================================
     جشن ناحیه دوم
================================================= -->

<div class="middle-effect">

    <div class="flash"></div>

    <div class="gift">

        <div class="gift-box"></div>
        <div class="gift-lid"></div>

        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>

        <div class="gift-bow-left"></div>
        <div class="gift-bow-right"></div>

    </div>


    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>


    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>


    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="confetti"></div>

</div>


</body>
</html>
