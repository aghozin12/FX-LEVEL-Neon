<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
}

/* =========================================================
   INVISIBLE EFFECT AREA
   Covers only:
   Area 1: x=40..470 / y=486..541
   Area 2: x=40..470 / y=551..691

   Nothing is drawn here except particles.
   ========================================================= */

.effect-scene {
    position: absolute;
    left: 40px;
    top: 480px;
    width: 430px;
    height: 211px;

    overflow: hidden;

    background: transparent;
    border: 0;
    outline: 0;
    box-shadow: none;

    pointer-events: none;
}

/* =========================================================
   GIFT
   ========================================================= */

.gift {
    position: absolute;

    left: 50%;
    top: 4px;

    width: 76px;
    height: 64px;

    transform:
        translateX(-50%)
        scale(0);

    opacity: 0;

    z-index: 20;

    filter:
        drop-shadow(0 0 7px rgba(255,255,255,.35))
        drop-shadow(0 0 16px rgba(255,190,40,.25));

    animation: giftCycle 12s infinite;
}

/* Gift box */

.gift-box {
    position: absolute;

    left: 7px;
    bottom: 0;

    width: 62px;
    height: 45px;

    border-radius: 5px 5px 8px 8px;

    background:
        linear-gradient(
            90deg,
            #d81828 0%,
            #ff3344 42%,
            #c90e20 100%
        );

    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.18),
        inset 0 -5px 0 rgba(0,0,0,.15);
}

/* Vertical ribbon */

.gift-box::before {
    content: "";

    position: absolute;

    left: 25px;
    top: 0;

    width: 12px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ffd83d,
            #fff3a0,
            #e7ae16
        );

    box-shadow:
        0 0 5px rgba(255,220,70,.55);
}

/* Horizontal ribbon */

.gift-box::after {
    content: "";

    position: absolute;

    left: 0;
    top: 11px;

    width: 100%;
    height: 9px;

    background:
        linear-gradient(
            90deg,
            #ffd83d,
            #fff3a0,
            #e7ae16
        );
}

/* Lid */

.gift-lid {
    position: absolute;

    left: 2px;
    top: 5px;

    width: 72px;
    height: 14px;

    border-radius: 4px;

    background:
        linear-gradient(
            90deg,
            #e51b2b,
            #ff4654,
            #c90e20
        );

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.2);

    transform-origin: 8px 100%;

    animation: lidOpen 12s infinite;
}

/* Lid ribbon */

.gift-lid::after {
    content: "";

    position: absolute;

    left: 29px;
    top: 0;

    width: 12px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ffd83d,
            #fff3a0,
            #e7ae16
        );
}

/* Bow */

.bow {
    position: absolute;

    left: 50%;
    top: -8px;

    width: 30px;
    height: 18px;

    transform: translateX(-50%);

    z-index: 5;
}

.bow-left,
.bow-right {
    position: absolute;

    top: 2px;

    width: 17px;
    height: 12px;

    background: #ffd83d;

    border-radius: 80% 20% 70% 30%;
}

.bow-left {
    left: 0;
    transform: rotate(25deg);
}

.bow-right {
    right: 0;
    transform: scaleX(-1) rotate(25deg);
}

.bow-center {
    position: absolute;

    left: 11px;
    top: 5px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #fff1a0;
}

/* =========================================================
   EXPLOSION FLASH
   ========================================================= */

.flash {
    position: absolute;

    left: 50%;
    top: 29px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: white;

    opacity: 0;

    transform: translate(-50%, -50%) scale(.1);

    filter:
        blur(1px)
        drop-shadow(0 0 12px white)
        drop-shadow(0 0 30px #ffd84a);

    animation: flash 12s infinite;

    z-index: 18;
}

/* =========================================================
   BURST RAYS
   ========================================================= */

.burst {
    position: absolute;

    left: 50%;
    top: 31px;

    width: 5px;
    height: 27px;

    border-radius: 99px;

    background: linear-gradient(
        to bottom,
        #fff7ad,
        #ffd329,
        rgba(255,120,0,0)
    );

    opacity: 0;

    transform-origin: 50% 100%;

    z-index: 17;

    animation: burst 12s infinite;
}

.b1 { --angle: -85deg; --distance: 52px; }
.b2 { --angle: -65deg; --distance: 62px; }
.b3 { --angle: -43deg; --distance: 58px; }
.b4 { --angle: -20deg; --distance: 52px; }
.b5 { --angle: 0deg;   --distance: 48px; }
.b6 { --angle: 20deg;  --distance: 52px; }
.b7 { --angle: 43deg;  --distance: 58px; }
.b8 { --angle: 65deg;  --distance: 62px; }
.b9 { --angle: 85deg;  --distance: 52px; }

/* =========================================================
   PARTICLES
   ========================================================= */

.particle {
    position: absolute;

    left: 50%;
    top: 31px;

    opacity: 0;

    z-index: 15;

    will-change: transform, opacity;

    animation:
        particleFlight 12s infinite;
}

/* Coins */

.coin {
    width: 13px;
    height: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff5a1 0 10%,
            #ffd52d 25%,
            #f0a900 70%,
            #b96b00 100%
        );

    border: 1px solid rgba(255,245,160,.9);

    box-shadow:
        0 0 5px rgba(255,205,35,.9),
        inset 0 0 2px white;
}

.coin::after {
    content: "$";

    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font:
        bold 8px Arial;

    color: rgba(139,80,0,.75);
}

/* Small spark */

.spark {
    width: 7px;
    height: 7px;

    background: #fff7a6;

    transform: rotate(45deg);

    box-shadow:
        0 0 5px #fff,
        0 0 12px #ffd72f;
}

/* Confetti */

.confetti {
    width: 7px;
    height: 15px;

    border-radius: 2px;

    background: #ff4c62;

    box-shadow:
        0 0 5px rgba(255,255,255,.25);
}

.c2 { background: #ffd52e; }
.c3 { background: #4de4ff; }
.c4 { background: #8cff72; }
.c5 { background: #c67cff; }

/* =========================================================
   INDIVIDUAL TRAJECTORIES
   Each particle:
   1. launches upward
   2. slows down
   3. hangs briefly
   4. falls on a curved path
   5. fades near the bottom
   ========================================================= */

.p1 { --x1:-155px; --y1:-88px; --x2:-120px; --y2:18px; --x3:-100px; --y3:155px; --r:510deg; }
.p2 { --x1:-115px; --y1:-118px; --x2:-82px;  --y2:8px;  --x3:-70px;  --y3:166px; --r:-430deg; }
.p3 { --x1:-72px;  --y1:-135px; --x2:-45px;  --y2:4px;  --x3:-38px;  --y3:170px; --r:620deg; }
.p4 { --x1:-25px;  --y1:-145px; --x2:-18px;  --y2:-5px; --x3:-22px;  --y3:174px; --r:-500deg; }

.p5 { --x1:24px;   --y1:-148px; --x2:18px;   --y2:-2px; --x3:25px;   --y3:172px; --r:580deg; }
.p6 { --x1:72px;   --y1:-136px; --x2:48px;   --y2:8px;  --x3:55px;   --y3:168px; --r:-470deg; }
.p7 { --x1:115px;  --y1:-116px; --x2:86px;   --y2:15px; --x3:78px;   --y3:158px; --r:520deg; }
.p8 { --x1:154px;  --y1:-82px;  --x2:120px;  --y2:22px; --x3:105px;  --y3:148px; --r:-610deg; }

/* Extra particles */

.p9  { --x1:-175px; --y1:-45px; --x2:-135px; --y2:28px; --x3:-118px; --y3:151px; --r:390deg; }
.p10 { --x1:175px;  --y1:-47px; --x2:140px;  --y2:32px; --x3:120px;  --y3:149px; --r:-420deg; }
.p11 { --x1:-95px;  --y1:-155px; --x2:-62px;  --y2:-5px; --x3:-72px;  --y3:169px; --r:450deg; }
.p12 { --x1:96px;   --y1:-153px; --x2:64px;   --y2:-1px; --x3:70px;   --y3:170px; --r:-480deg; }

/* =========================================================
   GIFT ANIMATION
   ========================================================= */

@keyframes giftCycle {

    /* hidden */
    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(8px)
            scale(.2)
            rotate(-4deg);
    }

    /* appears */
    7% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0deg);
    }

    /* stays */
    10%,
    17% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0deg);
    }

    /* anticipation */
    18% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1.04)
            rotate(-3deg);
    }

    19% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1.04)
            rotate(3deg);
    }

    20% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1.03)
            rotate(-3deg);
    }

    21% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1.05)
            rotate(2deg);
    }

    /* explosion */
    22% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(-2px)
            scale(1.12);
    }

    24% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(-10px)
            scale(1.35);
    }

    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.2);
    }
}

/* =========================================================
   LID OPEN
   ========================================================= */

@keyframes lidOpen {

    0%,
    17% {
        transform:
            rotate(0deg)
            translateY(0);
    }

    18% {
        transform:
            rotate(-4deg)
            translateY(-1px);
    }

    20% {
        transform:
            rotate(-18deg)
            translateY(-4px);
    }

    21% {
        transform:
            rotate(-38deg)
            translateY(-8px);
    }

    22% {
        transform:
            rotate(-52deg)
            translateY(-13px);
    }

    25%,
    100% {
        transform:
            rotate(-52deg)
            translateY(-13px);
    }
}

/* =========================================================
   FLASH
   ========================================================= */

@keyframes flash {

    0%,
    20% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    21.5% {
        opacity: 0;
    }

    22% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(.8);
    }

    23% {
        opacity: .85;
        transform:
            translate(-50%, -50%)
            scale(2.7);
    }

    24.5% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(5);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   BURST
   ========================================================= */

@keyframes burst {

    0%,
    20% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateY(0)
            scaleY(.1);
    }

    21.5% {
        opacity: 0;
    }

    22% {
        opacity: 1;

        transform:
            rotate(var(--angle))
            translateY(0)
            scaleY(.3);
    }

    24% {
        opacity: 1;

        transform:
            rotate(var(--angle))
            translateY(calc(var(--distance) * -1))
            scaleY(1);
    }

    27% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateY(calc(var(--distance) * -1.15))
            scaleY(.4);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   PARTICLE FLIGHT
   ========================================================= */

@keyframes particleFlight {

    /* Waiting */

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg)
            scale(.3);
    }

    20% {
        opacity: 0;
    }

    /* Explosion */

    22% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg)
            scale(.4);
    }

    /* Fast launch */

    27% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(var(--x1), var(--y1))
            rotate(calc(var(--r) * .25))
            scale(1);
    }

    /* Slowing down */

    33% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x1) * .98),
                calc(var(--y1) * .92)
            )
            rotate(calc(var(--r) * .55))
            scale(1.05);
    }

    /* Hover / almost weightless */

    39% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(var(--x1), var(--y1))
            rotate(calc(var(--r) * .75))
            scale(1);
    }

    44% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x2) + 8px),
                calc(var(--y2) - 5px)
            )
            rotate(var(--r))
            scale(.98);
    }

    /* Gravity starts */

    53% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x2) * .95),
                calc(var(--y2) + 28px)
            )
            rotate(calc(var(--r) * 1.15))
            scale(.96);
    }

    /* Curved descent */

    67% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x3) * .72),
                calc(var(--y3) * .45)
            )
            rotate(calc(var(--r) * 1.5))
            scale(.9);
    }

    80% {
        opacity: .85;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x3) * .92),
                calc(var(--y3) * .72)
            )
            rotate(calc(var(--r) * 1.8))
            scale(.82);
    }

    /* Near bottom */

    89% {
        opacity: .5;

        transform:
            translate(-50%, -50%)
            translate(
                var(--x3),
                calc(var(--y3) * .91)
            )
            rotate(calc(var(--r) * 2.05))
            scale(.7);
    }

    /* Fade */

    96% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x3) * 1.02),
                var(--y3)
            )
            rotate(calc(var(--r) * 2.3))
            scale(.55);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   SLIGHT DIFFERENCES BETWEEN PARTICLES
   ========================================================= */

.p2,
.p6,
.p10 {
    animation-delay: -.03s;
}

.p3,
.p7,
.p11 {
    animation-delay: -.06s;
}

.p4,
.p8,
.p12 {
    animation-delay: -.09s;
}

/* =========================================================
   SOFT DUST
   ========================================================= */

.dust {
    position: absolute;

    left: 50%;
    top: 32px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: rgba(255,239,152,.95);

    opacity: 0;

    box-shadow:
        0 0 5px white,
        0 0 10px #ffd52e;

    animation: dust 12s infinite;
}

.d1 { --dx:-80px; --dy:-65px; }
.d2 { --dx:-45px; --dy:-105px; }
.d3 { --dx:50px; --dy:-90px; }
.d4 { --dx:90px; --dy:-55px; }
.d5 { --dx:-120px; --dy:-20px; }
.d6 { --dx:125px; --dy:-15px; }

@keyframes dust {

    0%,
    20% {
        opacity: 0;
        transform: translate(-50%,-50%);
    }

    22% {
        opacity: 1;
    }

    31% {
        opacity: .8;
        transform:
            translate(-50%,-50%)
            translate(var(--dx),var(--dy))
            scale(1.2);
    }

    40% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--dx) * 1.3),
                calc(var(--dy) * 1.2)
            )
            scale(.4);
    }

    100% {
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="effect-scene">

    <!-- =========================
         GIFT
         ========================= -->

    <div class="gift">

        <div class="gift-lid"></div>

        <div class="bow">
            <div class="bow-left"></div>
            <div class="bow-right"></div>
            <div class="bow-center"></div>
        </div>

        <div class="gift-box"></div>

    </div>


    <!-- =========================
         FLASH
         ========================= -->

    <div class="flash"></div>


    <!-- =========================
         EXPLOSION RAYS
         ========================= -->

    <div class="burst b1"></div>
    <div class="burst b2"></div>
    <div class="burst b3"></div>
    <div class="burst b4"></div>
    <div class="burst b5"></div>
    <div class="burst b6"></div>
    <div class="burst b7"></div>
    <div class="burst b8"></div>
    <div class="burst b9"></div>


    <!-- =========================
         COINS
         ========================= -->

    <div class="particle coin p1"></div>
    <div class="particle coin p2"></div>
    <div class="particle coin p3"></div>
    <div class="particle coin p4"></div>

    <div class="particle coin p5"></div>
    <div class="particle coin p6"></div>
    <div class="particle coin p7"></div>
    <div class="particle coin p8"></div>


    <!-- =========================
         CONFETTI
         ========================= -->

    <div class="particle confetti p9"></div>
    <div class="particle confetti c2 p10"></div>
    <div class="particle confetti c3 p11"></div>
    <div class="particle confetti c4 p12"></div>


    <!-- =========================
         SPARKS
         ========================= -->

    <div class="particle spark p1"></div>
    <div class="particle spark p3"></div>
    <div class="particle spark p6"></div>
    <div class="particle spark p8"></div>


    <!-- =========================
         DUST
         ========================= -->

    <div class="dust d1"></div>
    <div class="dust d2"></div>
    <div class="dust d3"></div>
    <div class="dust d4"></div>
    <div class="dust d5"></div>
    <div class="dust d6"></div>

</div>

<script>

/*
=========================================================
Gift Celebration
Cycle: 12 seconds

7%   Gift appears
10-17% Gift waits
18-21% Shake / anticipation
22%  Explosion
27%  Particles launch
39%  Particles reach high point
44%  Hover
53%  Gravity starts
67-89% Smooth descent
96%  Fade
100% Reset

The entire animation is clipped to the invisible
effect-scene, so nothing can enter the lower webcam area.
=========================================================
*/

</script>

</body>
</html>
