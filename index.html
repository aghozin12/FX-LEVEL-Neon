<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

/* فقط محدوده نامرئی برای محدود کردن افکت */
.area {
    position: absolute;
    left: 40px;
    width: 430px;
    overflow: hidden;
    pointer-events: none;
}

/* محدوده بالایی اول */
.area-one {
    bottom: 389px;
    height: 140px;
}

/* محدوده بالایی دوم */
.area-two {
    bottom: 125px;
    height: 250px;
}


/* =========================
   GIFT
   ========================= */

.gift {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 42px;
    height: 38px;

    transform: translate(-50%, -50%);
    opacity: 0;

    animation: giftPop 3s ease-in-out infinite;
}

.gift-box {
    position: absolute;
    left: 4px;
    bottom: 0;

    width: 34px;
    height: 27px;

    background: linear-gradient(
        135deg,
        #ff315d,
        #ff0055
    );

    border-radius: 4px;

    box-shadow:
        0 0 8px #ff315d,
        0 0 18px #ff0055;
}

.gift-lid {
    position: absolute;
    left: 1px;
    top: 4px;

    width: 40px;
    height: 8px;

    background: #ff174f;
    border-radius: 3px;

    box-shadow: 0 0 8px #ff174f;
}

.gift-ribbon-v {
    position: absolute;
    left: 18px;
    top: 4px;

    width: 6px;
    height: 34px;

    background: #ffd21c;
}

.gift-ribbon-h {
    position: absolute;
    left: 1px;
    top: 15px;

    width: 40px;
    height: 5px;

    background: #ffd21c;
}


/* =========================
   COINS
   ========================= */

.coin {
    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: radial-gradient(
        circle at 35% 30%,
        #fff27a,
        #ffd21c 45%,
        #ff9d00
    );

    border: 1px solid #fff27a;

    box-shadow:
        0 0 5px #ffd21c,
        0 0 12px #ffae00;

    opacity: 0;

    animation: coinFly 3s ease-out infinite;
}

.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b5b00;
    font-size: 8px;
    font-weight: 900;
}


/* =========================
   SPARKS
   ========================= */

.spark {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 12px #00ff88;

    opacity: 0;

    animation: sparkBurst 3s ease-out infinite;
}


/* =========================
   CONFETTI
   ========================= */

.confetti {
    position: absolute;

    width: 5px;
    height: 11px;

    border-radius: 2px;

    opacity: 0;

    animation: confettiFall 3s linear infinite;
}


/* =========================
   ANIMATIONS
   ========================= */

@keyframes giftPop {

    0%, 55%, 100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.5)
            rotate(-8deg);
    }

    10% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15)
            rotate(5deg);
    }

    20% {
        transform:
            translate(-50%, -50%)
            scale(.9)
            rotate(-3deg);
    }

    32% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }
}


@keyframes coinFly {

    0% {
        opacity: 0;

        transform:
            translate(0, 0)
            scale(.4)
            rotate(0deg);
    }

    10% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(var(--x), var(--y))
            scale(1)
            rotate(540deg);
    }
}


@keyframes sparkBurst {

    0%, 5% {
        opacity: 0;

        transform:
            translate(0, 0)
            scale(.2);
    }

    15% {
        opacity: 1;
    }

    55% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(var(--sx), var(--sy))
            scale(1.5);
    }
}


@keyframes confettiFall {

    0% {
        opacity: 0;

        transform:
            translateY(-30px)
            rotate(0deg);
    }

    10% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(180px)
            translateX(var(--cx))
            rotate(500deg);
    }
}


/* =========================
   AREA ONE
   ========================= */

.area-one .coin:nth-child(2) {
    left: 50%;
    top: 50%;
    --x: -150px;
    --y: -65px;
}

.area-one .coin:nth-child(3) {
    left: 50%;
    top: 50%;
    --x: 150px;
    --y: -80px;
}

.area-one .coin:nth-child(4) {
    left: 50%;
    top: 50%;
    --x: -100px;
    --y: 45px;
}

.area-one .coin:nth-child(5) {
    left: 50%;
    top: 50%;
    --x: 110px;
    --y: 45px;
}


/* =========================
   AREA TWO
   ========================= */

.area-two .coin:nth-child(2) {
    left: 50%;
    top: 50%;
    --x: -180px;
    --y: -100px;
}

.area-two .coin:nth-child(3) {
    left: 50%;
    top: 50%;
    --x: 170px;
    --y: -115px;
}

.area-two .coin:nth-child(4) {
    left: 50%;
    top: 50%;
    --x: -130px;
    --y: 100px;
}

.area-two .coin:nth-child(5) {
    left: 50%;
    top: 50%;
    --x: 140px;
    --y: 110px;
}


/* =========================
   SPARK POSITIONS
   ========================= */

.spark:nth-child(6) {
    --sx: -170px;
    --sy: -70px;
}

.spark:nth-child(7) {
    --sx: 170px;
    --sy: -80px;
}

.spark:nth-child(8) {
    --sx: -140px;
    --sy: 80px;
}

.spark:nth-child(9) {
    --sx: 150px;
    --sy: 90px;
}


/* =========================
   CONFETTI POSITIONS
   ========================= */

.confetti:nth-child(10) {
    left: 15%;
    top: -15px;
    background: #ff315d;
    --cx: 50px;
}

.confetti:nth-child(11) {
    left: 40%;
    top: -20px;
    background: #ffd21c;
    --cx: -40px;
}

.confetti:nth-child(12) {
    left: 60%;
    top: -10px;
    background: #00ff88;
    --cx: 70px;
}

.confetti:nth-child(13) {
    left: 80%;
    top: -25px;
    background: #8c52ff;
    --cx: -60px;
}

</style>
</head>

<body>

<!-- فقط افکت اول -->
<div class="area area-one">

    <div class="gift">
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

</div>


<!-- فقط افکت دوم -->
<div class="area area-two">

    <div class="gift">
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

</div>

</body>
</html>
