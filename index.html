<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080,initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: transparent;
}

/* =========================================================
   EFFECT AREA
   فقط فضای بالایی
========================================================= */

#celebration {
  position: absolute;
  left: 40px;
  top: 0;

  width: 430px;
  height: 691px;

  overflow: hidden;
  pointer-events: none;

  background: transparent;
  border: 0;
  outline: 0;
  box-shadow: none;
}

#fx {
  position: absolute;
  inset: 0;

  width: 430px;
  height: 691px;

  pointer-events: none;
}


/* =========================================================
   GIFT
========================================================= */

#gift {
  position: absolute;

  left: 50%;
  top: 487px;

  width: 54px;
  height: 48px;

  opacity: 0;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);

  transform-origin: 50% 100%;

  z-index: 20;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.30))
    drop-shadow(0 0 7px rgba(255,190,55,.18));
}

#gift.visible {
  opacity: 1;
}


/* =========================================================
   GIFT BODY
========================================================= */

.gift-body {
  position: absolute;

  left: 3px;
  right: 3px;
  bottom: 0;

  height: 35px;

  border-radius: 3px;

  background:
    linear-gradient(
      105deg,
      #6f0813 0%,
      #a50d1d 24%,
      #c51a2b 48%,
      #920b19 73%,
      #5c0710 100%
    );

  border: 1px solid rgba(45,0,5,.85);

  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,.14),
    inset -2px -4px 7px rgba(0,0,0,.24);
}


/* vertical ribbon */

.gift-body::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 7px;
  height: 100%;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #a66c09 0%,
      #e4b52c 32%,
      #ffe178 50%,
      #c58c13 72%,
      #855706 100%
    );

  box-shadow:
    0 0 2px rgba(255,205,65,.25);
}


/* =========================================================
   LID
========================================================= */

.gift-lid {
  position: absolute;

  left: -1px;
  top: 4px;

  width: 56px;
  height: 12px;

  border-radius: 3px;

  background:
    linear-gradient(
      105deg,
      #680811,
      #a60d1c 30%,
      #c91a2a 50%,
      #920a18 78%,
      #5b0610
    );

  border: 1px solid rgba(48,0,5,.8);

  transform-origin: 50% 100%;

  z-index: 5;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.15),
    0 2px 3px rgba(0,0,0,.22);
}


/* ribbon on lid */

.gift-lid::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -1px;

  width: 7px;
  height: 12px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #986307,
      #e4b42c,
      #ffe07a,
      #bd8610,
      #825205
    );
}


/* =========================================================
   SUBTLE BOW
========================================================= */

.bow {
  position: absolute;

  left: 50%;
  top: -2px;

  width: 25px;
  height: 17px;

  transform: translateX(-50%);

  z-index: 10;
}

.bow span {
  position: absolute;

  display: block;

  background:
    linear-gradient(
      135deg,
      #9b670b,
      #d8a921 35%,
      #f5d568 52%,
      #a9700a
    );

  border: 1px solid rgba(105,67,0,.65);

  box-shadow:
    0 1px 2px rgba(0,0,0,.22);
}

.bow .left {
  left: 0;
  top: 2px;

  width: 13px;
  height: 9px;

  border-radius: 9px 3px 7px 4px;

  transform: rotate(17deg);
}

.bow .right {
  right: 0;
  top: 2px;

  width: 13px;
  height: 9px;

  border-radius: 3px 9px 4px 7px;

  transform: rotate(-17deg);
}

.bow .center {
  left: 50%;
  top: 5px;

  width: 7px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff0a0,
      #d7a21c 55%,
      #8a5905
    );
}


/* =========================================================
   APPEAR
========================================================= */

#gift.show {
  animation:
    giftShow
    .65s
    cubic-bezier(.22,.75,.3,1)
    forwards;
}

@keyframes giftShow {

  0% {
    opacity: 0;

    transform:
      translateX(-50%)
      translateY(10px)
      scale(.72);
  }

  70% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(-1px)
      scale(1.025);
  }

  100% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }
}


/* =========================================================
   REALISTIC SHAKE
========================================================= */

#gift.shake {
  animation:
    giftShake
    .82s
    cubic-bezier(.36,.07,.19,.97)
    forwards;
}

@keyframes giftShake {

  0% {
    opacity: 1;
    transform:
      translateX(-50%)
      rotate(0deg)
      scale(1);
  }

  12% {
    transform:
      translateX(calc(-50% - 2px))
      rotate(-2.5deg)
      scale(1.005);
  }

  24% {
    transform:
      translateX(calc(-50% + 2.5px))
      rotate(2.8deg)
      scale(1.008);
  }

  36% {
    transform:
      translateX(calc(-50% - 3px))
      rotate(-3deg)
      scale(1.012);
  }

  48% {
    transform:
      translateX(calc(-50% + 3px))
      rotate(3deg)
      scale(1.012);
  }

  60% {
    transform:
      translateX(calc(-50% - 2px))
      rotate(-2.2deg)
      scale(1.006);
  }

  72% {
    transform:
      translateX(calc(-50% + 1.5px))
      rotate(1.8deg)
      scale(1.003);
  }

  86% {
    transform:
      translateX(calc(-50% - .7px))
      rotate(-.8deg)
      scale(1);
  }

  100% {
    opacity: 1;

    transform:
      translateX(-50%)
      rotate(0deg)
      scale(1);
  }
}


/* =========================================================
   LID OPEN
========================================================= */

#gift.explode .gift-lid {
  animation:
    lidOpen
    .32s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}

@keyframes lidOpen {

  0% {
    transform:
      rotate(0deg)
      translateY(0);
  }

  45% {
    transform:
      rotate(-25deg)
      translateY(-5px);
  }

  100% {
    transform:
      rotate(-52deg)
      translateY(-10px);
  }
}


/* =========================================================
   GIFT DISAPPEARS WITH EXPLOSION
========================================================= */

#gift.explode {
  animation:
    giftExplode
    .32s
    ease-out
    forwards;
}

@keyframes giftExplode {

  0% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }

  30% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(-2px)
      scale(1.05);
  }

  100% {
    opacity: 0;

    transform:
      translateX(-50%)
      translateY(-5px)
      scale(1.16);
  }
}

</style>
</head>


<body>

<div id="celebration">

  <canvas
    id="fx"
    width="860"
    height="1382">
  </canvas>

  <div id="gift">

    <div class="gift-lid"></div>

    <div class="bow">
      <span class="left"></span>
      <span class="right"></span>
      <span class="center"></span>
    </div>

    <div class="gift-body"></div>

  </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const W = 430;
const H = 691;

const DPR = 2;

const canvas =
  document.getElementById("fx");

const ctx =
  canvas.getContext("2d");

ctx.scale(DPR, DPR);

const gift =
  document.getElementById("gift");


/*
  Gift دقیقاً داخل محدوده اول
*/
const EXPLOSION_X =
  W / 2;

const EXPLOSION_Y =
  514;


/*
  مدت دیده شدن Gift
*/
const GIFT_WAIT =
  3800;


/*
  مدت لرزش
*/
const SHAKE_TIME =
  820;


/*
  زمان انفجار
*/
const EXPLOSION_DELAY =
  GIFT_WAIT +
  SHAKE_TIME;


/*
  فاصله بین دو Gift
*/
const FULL_CYCLE =
  13500;


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];
const rings = [];


/* =========================================================
   RANDOM
========================================================= */

function random(min,max) {
  return Math.random() *
    (max-min) +
    min;
}

function clamp(v,min,max) {
  return Math.max(
    min,
    Math.min(max,v)
  );
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

  constructor(type,x,y) {

    this.type = type;

    this.x = x;
    this.y = y;


    /*
      پرتاب به بالا
    */
    const angle =
      random(
        Math.PI * 1.18,
        Math.PI * 1.82
      );

    let speed;

    if (type === "coin") {
      speed =
        random(170,245);
    }
    else if (type === "confetti") {
      speed =
        random(145,215);
    }
    else {
      speed =
        random(190,280);
    }


    this.vx =
      Math.cos(angle) *
      speed;

    this.vy =
      Math.sin(angle) *
      speed;


    /*
      فیزیک
    */
    this.gravity =
      type === "spark"
      ? random(180,240)
      : random(245,315);


    this.drag =
      random(.984,.993);


    /*
      حرکت نرم جانبی
    */
    this.wavePhase =
      random(0,Math.PI*2);

    this.waveSpeed =
      random(.8,1.7);

    this.waveAmount =
      random(5,16);


    /*
      اندازه
    */
    if (type === "coin") {
      this.size =
        random(6.5,10);
    }
    else if (type === "confetti") {
      this.size =
        random(4,8);
    }
    else {
      this.size =
        random(1.5,3.5);
    }


    /*
      عمر
    */
    if (type === "coin") {
      this.life =
        random(3.0,3.7);
    }
    else if (type === "confetti") {
      this.life =
        random(2.8,3.5);
    }
    else {
      this.life =
        random(.55,1.2);
    }

    this.maxLife =
      this.life;


    /*
      rotation
    */
    this.rotation =
      random(0,Math.PI*2);

    this.rotationSpeed =
      random(-7,7);


    /*
      Coin metal
    */
    const golds = [
      "#C99422",
      "#E0B642",
      "#F1D77A",
      "#B77B13",
      "#D9A72D"
    ];

    /*
      Confetti کنترل‌شده
    */
    const confetti = [
      "#D8B33F",
      "#B32B3B",
      "#D7D0B8",
      "#9B7B28",
      "#E5E0D2"
    ];


    if (type === "coin") {

      this.color =
        golds[
          Math.floor(
            Math.random() *
            golds.length
          )
        ];

    }
    else if (type === "confetti") {

      this.color =
        confetti[
          Math.floor(
            Math.random() *
            confetti.length
          )
        ];

    }
    else {

      this.color =
        "#F7D978";
    }
  }


  update(dt) {

    this.life -= dt;


    const elapsed =
      this.maxLife -
      this.life;


    this.x +=
      this.vx * dt +
      Math.sin(
        this.wavePhase +
        elapsed *
        this.waveSpeed
      ) *
      this.waveAmount *
      dt;


    this.y +=
      this.vy * dt;


    /*
      gravity
    */
    this.vy +=
      this.gravity * dt;


    /*
      air resistance
    */
    this.vx *=
      Math.pow(
        this.drag,
        dt * 60
      );


    /*
      rotation
    */
    this.rotation +=
      this.rotationSpeed *
      dt;


    /*
      پایین محدوده
    */
    if (this.y > H - 5) {

      this.y =
        H - 5;

      this.vy *=
        -0.10;

      this.vx *=
        .86;
    }


    /*
      sides
    */
    if (this.x < -35) {

      this.x = -35;
      this.vx *= -.3;

    }

    if (this.x > W + 35) {

      this.x = W + 35;
      this.vx *= -.3;

    }
  }


  getAlpha() {

    let a =
      clamp(
        this.life /
        this.maxLife,
        0,
        1
      );


    /*
      fade پایین
    */
    if (this.y > 600) {

      a *=
        clamp(
          (686-this.y)/86,
          0,
          1
        );
    }


    /*
      fade آخر عمر
    */
    if (this.life < .45) {

      a *=
        clamp(
          this.life/.45,
          0,
          1
        );
    }


    return a;
  }


  draw() {

    const alpha =
      this.getAlpha();

    if (alpha <= 0)
      return;


    ctx.save();

    ctx.globalAlpha =
      alpha;

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.rotation
    );


    /* =====================================================
       COIN
    ===================================================== */

    if (this.type === "coin") {

      /*
        چرخش فلزی
      */
      const depth =
        Math.max(
          .16,
          Math.abs(
            Math.cos(
              this.rotation *
              .9
            )
          )
        );

      ctx.scale(
        depth,
        1
      );


      /*
        سایه
      */
      ctx.beginPath();

      ctx.ellipse(
        1.5,
        2,
        this.size,
        this.size*.32,
        0,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        "rgba(0,0,0,.20)";

      ctx.fill();


      /*
        بدنه سکه
      */
      const gradient =
        ctx.createLinearGradient(
          -this.size,
          -this.size,
          this.size,
          this.size
        );

      gradient.addColorStop(
        0,
        "#8B5B0A"
      );

      gradient.addColorStop(
        .25,
        this.color
      );

      gradient.addColorStop(
        .5,
        "#FFF0A0"
      );

      gradient.addColorStop(
        .7,
        this.color
      );

      gradient.addColorStop(
        1,
        "#825207"
      );


      ctx.beginPath();

      ctx.arc(
        0,
        0,
        this.size,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        gradient;

      ctx.fill();


      /*
        لبه سکه
      */
      ctx.lineWidth =
        1;

      ctx.strokeStyle =
        "rgba(92,57,5,.85)";

      ctx.stroke();


      /*
        انعکاس کوچک
      */
      ctx.beginPath();

      ctx.arc(
        -this.size*.25,
        -this.size*.3,
        this.size*.18,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        "rgba(255,255,255,.45)";

      ctx.fill();
    }


    /* =====================================================
       CONFETTI
    ===================================================== */

    else if (
      this.type === "confetti"
    ) {

      ctx.fillStyle =
        this.color;

      ctx.globalAlpha *= .78;

      ctx.fillRect(
        -this.size*.6,
        -this.size*.22,
        this.size*1.2,
        this.size*.44
      );
    }


    /* =====================================================
       SPARK
    ===================================================== */

    else {

      ctx.strokeStyle =
        this.color;

      ctx.globalAlpha *= .9;

      ctx.lineWidth =
        1.3;

      ctx.beginPath();

      ctx.moveTo(
        -this.size*2.5,
        0
      );

      ctx.lineTo(
        this.size*2.5,
        0
      );

      ctx.moveTo(
        0,
        -this.size*2.5
      );

      ctx.lineTo(
        0,
        this.size*2.5
      );

      ctx.stroke();
    }


    ctx.restore();
  }
}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion() {


  /*
    Coins
  */
  for (
    let i=0;
    i<18;
    i++
  ) {

    particles.push(
      new Particle(
        "coin",

        EXPLOSION_X +
          random(-7,7),

        EXPLOSION_Y +
          random(-4,4)
      )
    );
  }


  /*
    Confetti
    کمتر و ریزتر
  */
  for (
    let i=0;
    i<15;
    i++
  ) {

    particles.push(
      new Particle(
        "confetti",

        EXPLOSION_X +
          random(-10,10),

        EXPLOSION_Y +
          random(-6,6)
      )
    );
  }


  /*
    Sparks
  */
  for (
    let i=0;
    i<25;
    i++
  ) {

    particles.push(
      new Particle(
        "spark",

        EXPLOSION_X +
          random(-5,5),

        EXPLOSION_Y +
          random(-5,5)
      )
    );
  }


  /*
    حلقه نور
  */
  rings.push({
    x: EXPLOSION_X,
    y: EXPLOSION_Y,
    r: 3,
    life: .42,
    maxLife: .42
  });


  rings.push({
    x: EXPLOSION_X,
    y: EXPLOSION_Y,
    r: 5,
    life: .28,
    maxLife: .28
  });
}


/* =========================================================
   RENDER
========================================================= */

let lastTime =
  performance.now();


function render(now) {

  let dt =
    (now-lastTime)/1000;

  lastTime =
    now;


  dt =
    Math.min(
      dt,
      .033
    );


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Particles
  */
  for (
    let i=particles.length-1;
    i>=0;
    i--
  ) {

    const p =
      particles[i];

    p.update(dt);
    p.draw();


    if (
      p.life <= 0 ||
      p.y > H+20
    ) {

      particles.splice(i,1);
    }
  }


  /*
    Explosion rings
  */
  for (
    let i=rings.length-1;
    i>=0;
    i--
  ) {

    const ring =
      rings[i];

    ring.life -= dt;

    ring.r +=
      155*dt;


    const alpha =
      clamp(
        ring.life/
        ring.maxLife,
        0,
        1
      );


    ctx.save();

    ctx.globalAlpha =
      alpha*.42;

    ctx.strokeStyle =
      "#E9C75B";

    ctx.lineWidth =
      2;

    ctx.beginPath();

    ctx.arc(
      ring.x,
      ring.y,
      ring.r,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();


    if (
      ring.life <= 0
    ) {

      rings.splice(i,1);
    }
  }


  requestAnimationFrame(
    render
  );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function playCelebration() {


  /*
    reset Gift
  */
  gift.classList.remove(
    "visible",
    "show",
    "shake",
    "explode"
  );


  /*
    force animation restart
  */
  void gift.offsetWidth;


  /*
    clear old particles
  */
  particles.length = 0;
  rings.length = 0;


  /*
    1 — Gift appears
  */
  gift.classList.add(
    "visible",
    "show"
  );


  /*
    2 — stays visible,
        then shakes
  */
  setTimeout(() => {

    gift.classList.remove(
      "show"
    );

    gift.classList.add(
      "shake"
    );

  }, GIFT_WAIT);


  /*
    3 — explode
  */
  setTimeout(() => {

    gift.classList.remove(
      "shake",
      "visible"
    );

    gift.classList.add(
      "explode"
    );

    createExplosion();

  }, EXPLOSION_DELAY);


  /*
    4 — long empty gap
  */
  setTimeout(() => {

    playCelebration();

  }, FULL_CYCLE);
}


/* =========================================================
   START
========================================================= */

requestAnimationFrame(
  render
);

setTimeout(() => {

  playCelebration();

}, 800);

</script>

</body>
</html>
