<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

/* فقط محدوده افکت بالا - بدون پنل */
.top-area {
    position: absolute;
    left: 40px;
    bottom: 389px;
    width: 430px;
    height: 140px;
    overflow: hidden;
    pointer-events: none;
}

/* فقط محدوده افکت وسط - بدون پنل */
.middle-area {
    position: absolute;
    left: 40px;
    bottom: 125px;
    width: 430px;
    height: 250px;
    overflow: hidden;
    pointer-events: none;
}

/* متن Copy Trade */
.copy-trade-text {
    position: absolute;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;

    color: #ff6500;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 800;

    text-shadow:
        0 0 5px #ff6500,
        0 0 12px #ff3300;

    z-index: 20;
}

/* ---------- GIFT ---------- */

.gift {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42px;
    height: 38px;

    transform: translate(-50%, -50%) scale(.7);
    opacity: 0;

    z-index: 10;
}

.gift-box {
    position: absolute;
    bottom: 0;
    left: 4px;
    width: 34px;
    height: 27px;

    background: linear-gradient(
        135deg,
        #ff315d,
        #ff0055
    );

    border-radius: 4px;

    box-shadow:
        0 0 8px #ff315d,
        0 0 18px #ff0055;
}

.gift-lid {
    position: absolute;
    top: 4px;
    left: 1px;
    width: 40px;
    height: 8px;

    background: #ff174f;
    border-radius: 3px;

    box-shadow: 0 0 8px #ff174f;
}

.gift-ribbon-v {
    position: absolute;
    left: 18px;
    top: 4px;
    width: 6px;
    height: 34px;
    background: #ffd21c;
}

.gift-ribbon-h {
    position: absolute;
    left: 1px;
    top: 15px;
    width: 40px;
    height: 5px;
    background: #ffd21c;
}

/* ---------- COINS ---------- */

.coin {
    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: radial-gradient(
        circle at 35% 30%,
        #fff27a,
        #ffd21c 45%,
        #ff9d00
    );

    border: 1px solid #fff27a;

    box-shadow:
        0 0 5px #ffd21c,
        0 0 12px #ffae00;

    opacity: 0;
}

.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b5b00;
    font-size: 8px;
    font-weight: 900;
}

/* ---------- SPARKS ---------- */

.spark {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 6px #fff,
        0 0 12px #00ff88;

    opacity: 0;
}

/* ---------- CONFETTI ---------- */

.confetti {
    position: absolute;

    width: 5px;
    height: 11px;

    opacity: 0;
    border-radius: 2px;
}

/* ---------- ANIMATIONS ---------- */

.profit-active .gift {
    animation: giftPop 3s ease-in-out infinite;
}

.profit-active .coin {
    animation: coinFly 3s ease-out infinite;
}

.profit-active .spark {
    animation: sparkBurst 3s ease-out infinite;
}

.profit-active .confetti {
    animation: confettiFall 3s linear infinite;
}

@keyframes giftPop {

    0%, 55%, 100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.5)
            rotate(-8deg);
    }

    10% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.15)
            rotate(5deg);
    }

    20% {
        transform:
            translate(-50%, -50%)
            scale(.9)
            rotate(-3deg);
    }

    32% {
        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
        opacity: 1;
    }
}

@keyframes coinFly {

    0% {
        opacity: 0;
        transform:
            translate(0, 20px)
            rotate(0deg)
            scale(.5);
    }

    12% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(540deg)
            scale(1);
    }
}

@keyframes sparkBurst {

    0%, 5% {
        opacity: 0;
        transform:
            translate(0, 0)
            scale(.2);
    }

    15% {
        opacity: 1;
    }

    55% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(
                var(--sx),
                var(--sy)
            )
            scale(1.5);
    }
}

@keyframes confettiFall {

    0% {
        opacity: 0;
        transform:
            translateY(-30px)
            rotate(0deg);
    }

    10% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(180px)
            translateX(var(--cx))
            rotate(500deg);
    }
}

/* ---------- POSITIONS ---------- */

/* Gift بالا */
.top-area .gift {
    top: 70%;
}

/* Gift وسط */
.middle-area .gift {
    top: 50%;
}

/* Coins بالا */
.top-area .coin:nth-child(2) {
    left: 45%;
    top: 70%;
    --x: -150px;
    --y: -70px;
}

.top-area .coin:nth-child(3) {
    left: 48%;
    top: 70%;
    --x: 140px;
    --y: -90px;
}

.top-area .coin:nth-child(4) {
    left: 50%;
    top: 70%;
    --x: -90px;
    --y: 40px;
}

.top-area .coin:nth-child(5) {
    left: 52%;
    top: 70%;
    --x: 110px;
    --y: 50px;
}

/* Coins وسط */
.middle-area .coin:nth-child(2) {
    left: 45%;
    top: 50%;
    --x: -180px;
    --y: -100px;
}

.middle-area .coin:nth-child(3) {
    left: 48%;
    top: 50%;
    --x: 160px;
    --y: -120px;
}

.middle-area .coin:nth-child(4) {
    left: 50%;
    top: 50%;
    --x: -120px;
    --y: 100px;
}

.middle-area .coin:nth-child(5) {
    left: 52%;
    top: 50%;
    --x: 130px;
    --y: 110px;
}

/* Sparks */
.spark:nth-child(6) {
    left: 50%;
    top: 50%;
    --sx: -170px;
    --sy: -70px;
}

.spark:nth-child(7) {
    left: 50%;
    top: 50%;
    --sx: 170px;
    --sy: -80px;
}

.spark:nth-child(8) {
    left: 50%;
    top: 50%;
    --sx: -140px;
    --sy: 80px;
}

.spark:nth-child(9) {
    left: 50%;
    top: 50%;
    --sx: 150px;
    --sy: 90px;
}

/* Confetti */
.confetti:nth-child(10) {
    left: 20%;
    top: -15px;
    background: #ff315d;
    --cx: 50px;
}

.confetti:nth-child(11) {
    left: 40%;
    top: -20px;
    background: #ffd21c;
    --cx: -40px;
}

.confetti:nth-child(12) {
    left: 60%;
    top: -10px;
    background: #00ff88;
    --cx: 70px;
}

.confetti:nth-child(13) {
    left: 80%;
    top: -25px;
    background: #8c52ff;
    --cx: -60px;
}
</style>
</head>

<body>

<!-- فقط متن + افکت داخل محدوده بالا -->
<div class="top-area">

    <div class="copy-trade-text" id="copyTradeBalance"></div>

    <div class="gift">
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

</div>


<!-- فقط افکت داخل محدوده وسط -->
<div class="middle-area">

    <div class="gift">
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

</div>


<script>

/* =========================
   تنظیمات Copy Trade
   ========================= */

const copyTradeBalance = 10000;

/* سود Copy Trade */
const copyTradeProfit = 250;


/* نمایش بالانس */
document.getElementById("copyTradeBalance").textContent =
    `TOTAL BALANCE COPY TRADE: $${copyTradeBalance.toLocaleString("en-US")}`;


/* =========================
   فعال کردن جشن
   ========================= */

if (copyTradeProfit > 0) {

    document.querySelectorAll(".top-area, .middle-area")
        .forEach(area => {

            area.classList.add("profit-active");

        });

}

</script>

</body>
</html>
