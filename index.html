<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

/* =========================================================
   GIFT AREA
   ========================================================= */

.gift-area {
    position: absolute;
    left: 40px;
    bottom: 539px;
    width: 430px;
    height: 55px;

    overflow: visible;
    pointer-events: none;
    background: transparent !important;
}


/* =========================================================
   FALL AREA
   از کنار Gift تا پایین
   ========================================================= */

.fall-area {
    position: absolute;
    left: 40px;
    bottom: 389px;
    width: 430px;
    height: 140px;

    overflow: hidden;
    pointer-events: none;
    background: transparent !important;
}


/* =========================================================
   GIFT
   ========================================================= */

.gift {
    position: absolute;

    left: 50%;
    top: 7px;

    width: 36px;
    height: 30px;

    transform: translateX(-50%);

    animation:
        giftShake 11s infinite;

    z-index: 20;
}


/* بدنه */
.gift-box {
    position: absolute;

    left: 3px;
    bottom: 0;

    width: 30px;
    height: 21px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #ff1744 0%,
            #ff4081 48%,
            #ff1744 100%
        );

    box-shadow:
        0 0 7px rgba(255, 23, 68, .9),
        0 0 18px rgba(255, 64, 129, .55);
}


/* درب */
.gift-lid {
    position: absolute;

    left: 1px;
    top: 3px;

    width: 34px;
    height: 8px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #ff4081,
            #ff80ab,
            #ff4081
        );

    transform-origin: center bottom;

    animation:
        giftLid 11s infinite;
}


/* روبان */
.gift-ribbon-v {
    position: absolute;

    left: 15px;
    top: 3px;

    width: 5px;
    height: 27px;

    background: #ffd740;

    box-shadow:
        0 0 7px #ffd740;
}

.gift-ribbon-h {
    position: absolute;

    left: 4px;
    top: 10px;

    width: 28px;
    height: 4px;

    background: #ffd740;
}


/* =========================================================
   FLASH طبیعی
   ========================================================= */

.explosion-flash {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(255,235,130,.65) 18%,
            rgba(255,193,7,.2) 45%,
            transparent 72%
        );

    transform:
        translate(-50%, -50%)
        scale(.05);

    opacity: 0;

    animation:
        explosionFlash 11s infinite;
}


/* =========================================================
   موج نور انفجار
   ========================================================= */

.explosion-ring {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 8px;
    height: 8px;

    border: 2px solid rgba(255,215,64,.9);
    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;

    animation:
        explosionRing 11s infinite;
}


/* =========================================================
   ذرات انفجار
   ========================================================= */

.burst {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 6px #fff,
        0 0 12px #ffd740;

    opacity: 0;

    animation:
        burstParticle 11s infinite;
}


/* مسیرهای انفجار */

.burst:nth-of-type(1) {
    --bx: -38px;
    --by: -24px;
    animation-delay: 0s;
}

.burst:nth-of-type(2) {
    --bx: 38px;
    --by: -25px;
    animation-delay: .04s;
}

.burst:nth-of-type(3) {
    --bx: -48px;
    --by: 3px;
    animation-delay: .08s;
}

.burst:nth-of-type(4) {
    --bx: 48px;
    --by: 2px;
    animation-delay: .12s;
}

.burst:nth-of-type(5) {
    --bx: -32px;
    --by: 26px;
    animation-delay: .16s;
}

.burst:nth-of-type(6) {
    --bx: 32px;
    --by: 27px;
    animation-delay: .2s;
}


/* =========================================================
   ذرات ریز انفجار
   ========================================================= */

.micro {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ffd740;

    box-shadow:
        0 0 6px #ffd740;

    opacity: 0;

    animation:
        microBurst 11s infinite;
}

.micro:nth-of-type(7) {
    --mx: -55px;
    --my: -12px;
}

.micro:nth-of-type(8) {
    --mx: 55px;
    --my: -15px;
}

.micro:nth-of-type(9) {
    --mx: -60px;
    --my: 18px;
}

.micro:nth-of-type(10) {
    --mx: 60px;
    --my: 20px;
}


/* =========================================================
   برگ / CONFETTI
   از کناره‌های Gift وارد ریزش می‌شوند
   ========================================================= */

.leaf {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 6px;
    height: 11px;

    border-radius: 2px 7px 2px 7px;

    opacity: 0;

    animation:
        professionalFall 11s infinite;
}


/* مسیر چپ */
.leaf:nth-of-type(11) {
    background: #ff4081;

    --startX: -20px;
    --midX: -55px;
    --endX: -125px;

    --startY: 0px;
    --midY: 52px;
    --endY: 135px;

    --rot: 520deg;

    animation-delay: 1.05s;
}

.leaf:nth-of-type(12) {
    background: #ffd740;

    --startX: -18px;
    --midX: -75px;
    --endX: -165px;

    --startY: 2px;
    --midY: 58px;
    --endY: 130px;

    --rot: -470deg;

    animation-delay: 1.15s;
}

.leaf:nth-of-type(13) {
    background: #40c4ff;

    --startX: -14px;
    --midX: -35px;
    --endX: -85px;

    --startY: 4px;
    --midY: 65px;
    --endY: 138px;

    --rot: 600deg;

    animation-delay: 1.3s;
}


/* مسیر راست */
.leaf:nth-of-type(14) {
    background: #69f0ae;

    --startX: 20px;
    --midX: 55px;
    --endX: 125px;

    --startY: 0px;
    --midY: 50px;
    --endY: 135px;

    --rot: -500deg;

    animation-delay: 1.08s;
}

.leaf:nth-of-type(15) {
    background: #ff5252;

    --startX: 18px;
    --midX: 75px;
    --endX: 165px;

    --startY: 2px;
    --midY: 58px;
    --endY: 132px;

    --rot: 480deg;

    animation-delay: 1.2s;
}

.leaf:nth-of-type(16) {
    background: #7c4dff;

    --startX: 14px;
    --midX: 35px;
    --endX: 85px;

    --startY: 4px;
    --midY: 65px;
    --endY: 138px;

    --rot: -590deg;

    animation-delay: 1.35s;
}


/* برگ‌های کوچک */
.leaf.small {
    width: 4px;
    height: 8px;
}

.leaf:nth-of-type(17) {
    background: #ffab40;

    --startX: -10px;
    --midX: -42px;
    --endX: -105px;

    --startY: 5px;
    --midY: 70px;
    --endY: 140px;

    --rot: 430deg;

    animation-delay: 1.4s;
}

.leaf:nth-of-type(18) {
    background: #fff;

    --startX: 10px;
    --midX: 42px;
    --endX: 105px;

    --startY: 5px;
    --midY: 70px;
    --endY: 140px;

    --rot: -430deg;

    animation-delay: 1.45s;
}


/* =========================================================
   سکه‌ها
   ========================================================= */

.coin {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0,
            #ffd740 45%,
            #f57c00
        );

    border: 1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 7px #ffd740,
        0 0 14px rgba(255,193,7,.7);

    opacity: 0;

    animation:
        coinProfessional 11s infinite;
}

.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #8d5a00;

    font-size: 6px;
    font-weight: bold;
}


/* مسیر سکه‌ها */

.coin:nth-of-type(19) {
    --cx: -105px;
    --cy: 132px;
    --cr: 540deg;
    animation-delay: 1.1s;
}

.coin:nth-of-type(20) {
    --cx: -55px;
    --cy: 115px;
    --cr: -460deg;
    animation-delay: 1.25s;
}

.coin:nth-of-type(21) {
    --cx: 55px;
    --cy: 120px;
    --cr: 500deg;
    animation-delay: 1.4s;
}

.coin:nth-of-type(22) {
    --cx: 105px;
    --cy: 135px;
    --cr: -520deg;
    animation-delay: 1.55s;
}


/* =========================================================
   STAR SPARKS
   ========================================================= */

.star {
    position: absolute;

    left: 50%;
    top: 22px;

    width: 4px;
    height: 4px;

    background: white;

    box-shadow:
        0 0 7px white,
        0 0 14px #ffd740;

    border-radius: 50%;

    opacity: 0;

    animation:
        starBurst 11s infinite;
}

.star:nth-of-type(23) {
    --sx: -65px;
    --sy: 35px;
}

.star:nth-of-type(24) {
    --sx: 65px;
    --sy: 35px;
}

.star:nth-of-type(25) {
    --sx: -105px;
    --sy: 70px;
}

.star:nth-of-type(26) {
    --sx: 105px;
    --sy: 70px;
}


/* =========================================================
   GIFT SHAKE
   حدود 3 ثانیه فرصت قبل از انفجار
   ========================================================= */

@keyframes giftShake {

    /* سکون */
    0%,
    7% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.7);
    }

    /* ظاهر شدن */
    9% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(.85);
    }

    /* مکث */
    10%,
    17% {
        transform:
            translateX(-50%)
            rotate(0deg)
            scale(.9);
    }

    /* تکان اول */
    18% {
        transform:
            translateX(-50%)
            rotate(-4deg)
            scale(.92);
    }

    19% {
        transform:
            translateX(-50%)
            rotate(4deg)
            scale(.94);
    }

    20% {
        transform:
            translateX(-50%)
            rotate(-5deg)
            scale(.95);
    }

    /* تکان دوم */
    21% {
        transform:
            translateX(-50%)
            rotate(6deg)
            scale(.97);
    }

    22% {
        transform:
            translateX(-50%)
            rotate(-7deg)
            scale(.99);
    }

    23% {
        transform:
            translateX(-50%)
            rotate(8deg)
            scale(1);
    }

    /* لحظه انفجار */
    25% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(1.25);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   LID
   ========================================================= */

@keyframes giftLid {

    0%,
    20% {
        transform:
            rotate(0deg)
            translate(0,0);
    }

    22% {
        transform:
            rotate(-5deg)
            translate(0,0);
    }

    24% {
        transform:
            rotate(-28deg)
            translate(-5px,-5px);
    }

    28% {
        transform:
            rotate(-42deg)
            translate(-7px,-8px);
    }

    32%,
    100% {
        transform:
            rotate(-42deg)
            translate(-7px,-8px);
    }
}


/* =========================================================
   FLASH
   ========================================================= */

@keyframes explosionFlash {

    0%,
    22% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.05);
    }

    24% {
        opacity: .95;
        transform:
            translate(-50%,-50%)
            scale(.55);
    }

    27% {
        opacity: .45;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    31% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(1.8);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   EXPLOSION RING
   ========================================================= */

@keyframes explosionRing {

    0%,
    22% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    24% {
        opacity: .9;
    }

    34% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(7);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   BURST
   ========================================================= */

@keyframes burstParticle {

    0%,
    21% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    24% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(1.3);
    }

    34% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--bx)),
                calc(-50% + var(--by))
            )
            scale(.8);
    }

    43% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--bx) * 1.3),
                calc(-50% + var(--by) * 1.3)
            )
            scale(.2);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   MICRO BURST
   ========================================================= */

@keyframes microBurst {

    0%,
    22% {
        opacity: 0;
    }

    25% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    40% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--mx)),
                calc(-50% + var(--my))
            )
            scale(.2);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   PROFESSIONAL FALL
   حرکت موج‌دار و طبیعی
   ========================================================= */

@keyframes professionalFall {

    0%,
    9% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                var(--startX),
                var(--startY)
            )
            rotate(0deg)
            scale(.3);
    }

    /* خروج از کنار Gift */
    16% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--startX),
                var(--startY)
            )
            rotate(70deg)
            scale(1);
    }

    /* حرکت مورب اول */
    38% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--midX),
                var(--midY)
            )
            rotate(calc(var(--rot) * .35))
            scale(1);
    }

    /* پایین آمدن */
    65% {
        opacity: .9;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--midX) * .7 + var(--endX) * .3),
                calc(var(--midY) * .7 + var(--endY) * .3)
            )
            rotate(calc(var(--rot) * .7))
            scale(.9);
    }

    /* رسیدن به پایین */
    86% {
        opacity: .65;

        transform:
            translate(-50%,-50%)
            translate(
                var(--endX),
                var(--endY)
            )
            rotate(var(--rot))
            scale(.72);
    }

    /* محو شدن */
    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--endX) * 1.03),
                calc(var(--endY) * 1.04)
            )
            rotate(calc(var(--rot) + 120deg))
            scale(.45);
    }
}


/* =========================================================
   COINS
   ========================================================= */

@keyframes coinProfessional {

    0%,
    10% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    17% {
        opacity: 1;
    }

    31% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--cx) * .25),
                25px
            )
            rotate(180deg)
            scale(1);
    }

    57% {
        opacity: .95;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--cx) * .65),
                75px
            )
            rotate(360deg)
            scale(.9);
    }

    83% {
        opacity: .65;

        transform:
            translate(-50%,-50%)
            translate(
                var(--cx),
                var(--cy)
            )
            rotate(var(--cr))
            scale(.7);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                var(--cx),
                calc(var(--cy) + 10px)
            )
            rotate(calc(var(--cr) + 180deg))
            scale(.35);
    }
}


/* =========================================================
   STARS
   ========================================================= */

@keyframes starBurst {

    0%,
    22% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    26% {
        opacity: 1;
    }

    40% {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--sx)),
                calc(-50% + var(--sy))
            )
            scale(1.5);
    }

    52% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--sx)),
                calc(-50% + var(--sy))
            )
            scale(.2);
    }

    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     GIFT
     ===================================================== -->

<div class="gift-area">

    <div class="explosion-flash"></div>
    <div class="explosion-ring"></div>

    <div class="gift">
        <div class="gift-box"></div>
        <div class="gift-lid"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

</div>


<!-- =====================================================
     انفجار + ریزش
     ===================================================== -->

<div class="fall-area">

    <!-- انفجار -->
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>

    <!-- ذرات ریز -->
    <div class="micro"></div>
    <div class="micro"></div>
    <div class="micro"></div>
    <div class="micro"></div>

    <!-- برگ / Confetti -->
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>

    <div class="leaf small"></div>
    <div class="leaf small"></div>

    <!-- Coins -->
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <!-- Stars -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

</div>

</body>
</html>
