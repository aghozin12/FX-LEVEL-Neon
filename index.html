<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

/* =====================================================
   کل صحنه افکت
   فقط برای Clip کردن افکت
   هیچ ظاهر قابل مشاهده‌ای ندارد
   ===================================================== */

.scene {
    position: absolute;

    left: 40px;
    top: 480px;

    width: 430px;
    height: 215px;

    overflow: hidden;

    pointer-events: none;

    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
}


/* =====================================================
   GIFT
   ===================================================== */

.gift {
    position: absolute;

    left: 50%;
    top: 7px;

    width: 38px;
    height: 31px;

    transform: translateX(-50%);

    z-index: 50;

    animation: gift 12s infinite;
}


/* بدنه */
.gift-box {
    position: absolute;

    left: 3px;
    bottom: 0;

    width: 32px;
    height: 22px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #e91445,
            #ff4081 50%,
            #e91445
        );

    box-shadow:
        0 0 7px rgba(255,30,90,.9),
        0 0 18px rgba(255,30,90,.45);
}


/* درب */
.gift-lid {
    position: absolute;

    left: 1px;
    top: 3px;

    width: 36px;
    height: 8px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #ff4081,
            #ff8aae,
            #ff4081
        );

    transform-origin: center bottom;

    animation: lid 12s infinite;
}


/* روبان */
.gift-ribbon-v {
    position: absolute;

    left: 16px;
    top: 3px;

    width: 5px;
    height: 28px;

    background: #ffd740;

    box-shadow:
        0 0 7px #ffd740;
}

.gift-ribbon-h {
    position: absolute;

    left: 4px;
    top: 10px;

    width: 30px;
    height: 4px;

    background: #ffd740;
}


/* =====================================================
   FLASH
   ===================================================== */

.flash {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.98) 0%,
            rgba(255,239,150,.75) 15%,
            rgba(255,193,7,.25) 42%,
            transparent 72%
        );

    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(.05);

    animation: flash 12s infinite;
}


/* =====================================================
   انفجار اولیه
   ===================================================== */

.burst {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 13px #ffd740;

    opacity: 0;

    animation: burst 12s infinite;
}


/* =====================================================
   ستاره‌های انفجار
   ===================================================== */

.star {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 7px white,
        0 0 15px #ffd740;

    opacity: 0;

    animation: star 12s infinite;
}


/* =====================================================
   CONFETTI / برگ‌های اصلی
   ابتدا بالا می‌روند
   سپس با مسیر منحنی پایین می‌آیند
   ===================================================== */

.confetti {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 6px;
    height: 12px;

    border-radius: 2px 7px 2px 7px;

    opacity: 0;

    animation: confetti 12s infinite;
}


/* مسیر 1 */
.confetti:nth-of-type(1) {
    background: #ff4081;

    --upX: -55px;
    --upY: -65px;

    --midX: -95px;
    --midY: -25px;

    --downX: -145px;
    --downY: 165px;

    --rot: 620deg;

    animation-delay: .0s;
}


/* مسیر 2 */
.confetti:nth-of-type(2) {
    background: #ffd740;

    --upX: -25px;
    --upY: -88px;

    --midX: -55px;
    --midY: -35px;

    --downX: -90px;
    --downY: 170px;

    --rot: -520deg;

    animation-delay: .08s;
}


/* مسیر 3 */
.confetti:nth-of-type(3) {
    background: #40c4ff;

    --upX: 35px;
    --upY: -78px;

    --midX: 70px;
    --midY: -30px;

    --downX: 120px;
    --downY: 170px;

    --rot: 580deg;

    animation-delay: .15s;
}


/* مسیر 4 */
.confetti:nth-of-type(4) {
    background: #69f0ae;

    --upX: 65px;
    --upY: -60px;

    --midX: 110px;
    --midY: -20px;

    --downX: 170px;
    --downY: 165px;

    --rot: -650deg;

    animation-delay: .22s;
}


/* مسیر 5 */
.confetti:nth-of-type(5) {
    background: #ff5252;

    --upX: -85px;
    --upY: -48px;

    --midX: -125px;
    --midY: 0px;

    --downX: -185px;
    --downY: 155px;

    --rot: 700deg;

    animation-delay: .3s;
}


/* مسیر 6 */
.confetti:nth-of-type(6) {
    background: #7c4dff;

    --upX: 90px;
    --upY: -48px;

    --midX: 125px;
    --midY: 0px;

    --downX: 185px;
    --downY: 155px;

    --rot: -680deg;

    animation-delay: .38s;
}


/* =====================================================
   برگ‌های کوچک‌تر
   ===================================================== */

.confetti.small {
    width: 4px;
    height: 8px;
}

.confetti:nth-of-type(7) {
    background: #ffab40;

    --upX: -45px;
    --upY: -52px;

    --midX: -85px;
    --midY: -5px;

    --downX: -125px;
    --downY: 150px;

    --rot: 470deg;

    animation-delay: .45s;
}

.confetti:nth-of-type(8) {
    background: #fff;

    --upX: 45px;
    --upY: -52px;

    --midX: 85px;
    --midY: -5px;

    --downX: 125px;
    --downY: 150px;

    --rot: -450deg;

    animation-delay: .52s;
}


/* =====================================================
   COINS
   ===================================================== */

.coin {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0,
            #ffd740 43%,
            #f57c00
        );

    border: 1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 7px #ffd740,
        0 0 15px rgba(255,193,7,.7);

    opacity: 0;

    animation: coin 12s infinite;
}

.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 6px;
    font-weight: bold;

    color: #8d5a00;
}


/* مسیر متفاوت سکه‌ها */

.coin:nth-of-type(9) {
    --upX: -35px;
    --upY: -75px;

    --midX: -60px;
    --midY: -30px;

    --downX: -110px;
    --downY: 168px;

    --rot: 720deg;

    animation-delay: .12s;
}

.coin:nth-of-type(10) {
    --upX: -8px;
    --upY: -95px;

    --midX: -25px;
    --midY: -42px;

    --downX: -40px;
    --downY: 170px;

    --rot: -620deg;

    animation-delay: .2s;
}

.coin:nth-of-type(11) {
    --upX: 15px;
    --upY: -90px;

    --midX: 35px;
    --midY: -38px;

    --downX: 65px;
    --downY: 172px;

    --rot: 680deg;

    animation-delay: .28s;
}

.coin:nth-of-type(12) {
    --upX: 42px;
    --upY: -65px;

    --midX: 75px;
    --midY: -25px;

    --downX: 130px;
    --downY: 165px;

    --rot: -750deg;

    animation-delay: .36s;
}


/* =====================================================
   ذرات طلایی ریز
   ===================================================== */

.dust {
    position: absolute;

    left: 50%;
    top: 23px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ffd740;

    box-shadow:
        0 0 7px #ffd740;

    opacity: 0;

    animation: dust 12s infinite;
}

.dust:nth-of-type(13) {
    --x: -120px;
    --y: 130px;
}

.dust:nth-of-type(14) {
    --x: -75px;
    --y: 150px;
}

.dust:nth-of-type(15) {
    --x: 80px;
    --y: 145px;
}

.dust:nth-of-type(16) {
    --x: 135px;
    --y: 125px;
}


/* =====================================================
   GIFT ANIMATION
   ===================================================== */

@keyframes gift {

    0%,
    7% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.65);
    }

    9% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(.85);
    }

    /* چند ثانیه آرام */
    10%,
    18% {
        transform:
            translateX(-50%)
            rotate(0deg)
            scale(.88);
    }

    /* تکان */
    19% {
        transform:
            translateX(-50%)
            rotate(-4deg)
            scale(.9);
    }

    20% {
        transform:
            translateX(-50%)
            rotate(4deg)
            scale(.92);
    }

    21% {
        transform:
            translateX(-50%)
            rotate(-6deg)
            scale(.94);
    }

    22% {
        transform:
            translateX(-50%)
            rotate(7deg)
            scale(.97);
    }

    23% {
        transform:
            translateX(-50%)
            rotate(-9deg)
            scale(1);
    }

    /* انفجار */
    24.5% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(1.3);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   LID
   ===================================================== */

@keyframes lid {

    0%,
    20% {
        transform:
            rotate(0deg)
            translate(0,0);
    }

    21.5% {
        transform:
            rotate(-7deg)
            translate(-1px,-1px);
    }

    23% {
        transform:
            rotate(-25deg)
            translate(-4px,-4px);
    }

    25% {
        transform:
            rotate(-45deg)
            translate(-7px,-8px);
    }

    35%,
    100% {
        transform:
            rotate(-45deg)
            translate(-7px,-8px);
    }
}


/* =====================================================
   FLASH
   ===================================================== */

@keyframes flash {

    0%,
    22% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.05);
    }

    24% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(.65);
    }

    26% {
        opacity: .5;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    30% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(1.8);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   انفجار اولیه
   ===================================================== */

@keyframes burst {

    0%,
    22% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    24% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(1.4);
    }

    29% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--bx, 35px)),
                calc(-50% + var(--by, -35px))
            )
            scale(.8);
    }

    36% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--bx, 35px) * 1.5),
                calc(-50% + var(--by, -35px) * 1.5)
            )
            scale(.15);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   ستاره
   ===================================================== */

@keyframes star {

    0%,
    23% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    25% {
        opacity: 1;
    }

    32% {
        opacity: 1;
        transform:
            translate(
                calc(-50% + var(--sx, 50px)),
                calc(-50% + var(--sy, -40px))
            )
            scale(1.5);
    }

    42% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   CONFETTI
   ⭐ حرکت طبیعی:
   پرتاب بالا → مکث → سقوط منحنی → محو
   ===================================================== */

@keyframes confetti {

    0%,
    22% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(0deg)
            scale(.25);
    }

    /* پرتاب سریع */
    27% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(calc(var(--rot) * .2))
            scale(1);
    }

    /* لحظه معلق */
    34% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(calc(var(--rot) * .4))
            scale(1);
    }

    /* شروع سقوط */
    48% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--midX),
                var(--midY)
            )
            rotate(calc(var(--rot) * .6))
            scale(.95);
    }

    /* سقوط اصلی */
    72% {
        opacity: .9;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--midX) * .45 + var(--downX) * .55),
                calc(var(--midY) * .45 + var(--downY) * .55)
            )
            rotate(calc(var(--rot) * .8))
            scale(.82);
    }

    /* رسیدن پایین */
    88% {
        opacity: .65;

        transform:
            translate(-50%,-50%)
            translate(
                var(--downX),
                var(--downY)
            )
            rotate(var(--rot))
            scale(.7);
    }

    /* محو شدن */
    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--downX) * 1.03),
                calc(var(--downY) * 1.02)
            )
            rotate(calc(var(--rot) + 160deg))
            scale(.35);
    }
}


/* =====================================================
   COIN
   ===================================================== */

@keyframes coin {

    0%,
    22% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(0deg)
            scale(.1);
    }

    /* پرتاب */
    28% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(220deg)
            scale(1);
    }

    /* معلق */
    36% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--upX),
                var(--upY)
            )
            rotate(420deg)
            scale(1);
    }

    /* سقوط */
    58% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            translate(
                var(--midX),
                var(--midY)
            )
            rotate(620deg)
            scale(.9);
    }

    /* نزدیک پایین */
    83% {
        opacity: .7;

        transform:
            translate(-50%,-50%)
            translate(
                var(--downX),
                var(--downY)
            )
            rotate(var(--rot))
            scale(.7);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            translate(
                var(--downX),
                calc(var(--downY) + 10px)
            )
            rotate(calc(var(--rot) + 180deg))
            scale(.3);
    }
}


/* =====================================================
   DUST
   ===================================================== */

@keyframes dust {

    0%,
    23% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    27% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    42% {
        opacity: .8;

        transform:
            translate(
                calc(-50% + var(--x) * .35),
                calc(-50% + var(--y) * .25)
            )
            scale(.8);
    }

    70% {
        opacity: .45;

        transform:
            translate(
                calc(-50% + var(--x) * .75),
                calc(-50% + var(--y) * .75)
            )
            scale(.55);
    }

    90% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- Gift -->
    <div class="gift">
        <div class="gift-box"></div>
        <div class="gift-lid"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

    <!-- نور انفجار -->
    <div class="flash"></div>

    <!-- انفجار -->
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>
    <div class="burst"></div>

    <!-- ستاره -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <!-- Confetti -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="confetti small"></div>
    <div class="confetti small"></div>

    <!-- Coins -->
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <!-- Dust -->
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>

</div>

</body>
</html>
