<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

/* =====================================================
   محدوده اول — بالای نوشته
   ===================================================== */

.gift-zone {
    position: absolute;
    left: 40px;
    bottom: 539px;
    width: 430px;
    height: 55px;
    overflow: visible;
    pointer-events: none;
    background: transparent !important;
}

/* =====================================================
   محدوده دوم — محل ریزش
   ===================================================== */

.fall-zone {
    position: absolute;
    left: 40px;
    bottom: 389px;
    width: 430px;
    height: 140px;
    overflow: hidden;
    pointer-events: none;
    background: transparent !important;
}

/* =====================================================
   GIFT
   ===================================================== */

.gift {
    position: absolute;

    left: 50%;
    top: -4px;

    width: 38px;
    height: 32px;

    transform: translateX(-50%) scale(.85);
    transform-origin: center bottom;

    animation: giftShake 6s infinite;
    z-index: 20;
}

/* بدنه */
.gift-box {
    position: absolute;
    left: 3px;
    bottom: 0;

    width: 32px;
    height: 23px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff4081,
            #ff1744
        );

    box-shadow:
        0 0 8px rgba(255, 23, 68, .9),
        0 0 18px rgba(255, 64, 129, .5);
}

/* درب */
.gift-lid {
    position: absolute;

    left: 1px;
    top: 3px;

    width: 36px;
    height: 8px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #ff4081,
            #ff80ab,
            #ff4081
        );

    transform-origin: center bottom;

    animation: lidOpen 6s infinite;
}

/* روبان */
.gift-ribbon-v {
    position: absolute;

    left: 16px;
    top: 3px;

    width: 6px;
    height: 29px;

    background: #ffd740;

    box-shadow:
        0 0 7px #ffd740;
}

.gift-ribbon-h {
    position: absolute;

    left: 4px;
    top: 11px;

    width: 30px;
    height: 4px;

    background: #ffd740;
}


/* =====================================================
   نور قبل از انفجار
   ===================================================== */

.flash {
    position: absolute;

    left: 50%;
    top: 15px;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95),
            rgba(255,215,64,.5),
            transparent 70%
        );

    transform: translate(-50%, -50%) scale(.1);

    opacity: 0;

    animation: flash 6s infinite;
}


/* =====================================================
   برگ‌ها / Confetti
   از بالا شروع می‌شوند و پایین می‌ریزند
   ===================================================== */

.leaf {
    position: absolute;

    left: 50%;
    top: 10px;

    width: 6px;
    height: 11px;

    border-radius: 2px 7px 2px 7px;

    opacity: 0;

    animation: leafFall 6s infinite;
}

/* رنگ‌ها و مسیرهای مختلف */

.leaf:nth-child(1) {
    background: #ff4081;
    --x: -190px;
    --y: 125px;
    --r: 500deg;
    animation-delay: 2.0s;
}

.leaf:nth-child(2) {
    background: #ffd740;
    --x: -150px;
    --y: 135px;
    --r: -430deg;
    animation-delay: 2.15s;
}

.leaf:nth-child(3) {
    background: #40c4ff;
    --x: -110px;
    --y: 115px;
    --r: 620deg;
    animation-delay: 2.3s;
}

.leaf:nth-child(4) {
    background: #69f0ae;
    --x: -65px;
    --y: 130px;
    --r: -520deg;
    animation-delay: 2.45s;
}

.leaf:nth-child(5) {
    background: #ff5252;
    --x: 60px;
    --y: 120px;
    --r: 560deg;
    animation-delay: 2.1s;
}

.leaf:nth-child(6) {
    background: #7c4dff;
    --x: 105px;
    --y: 135px;
    --r: -600deg;
    animation-delay: 2.25s;
}

.leaf:nth-child(7) {
    background: #ffab40;
    --x: 150px;
    --y: 118px;
    --r: 470deg;
    animation-delay: 2.4s;
}

.leaf:nth-child(8) {
    background: #fff;
    --x: 190px;
    --y: 130px;
    --r: -560deg;
    animation-delay: 2.55s;
}


/* =====================================================
   برگ‌های کوچک‌تر
   ===================================================== */

.leaf.small {
    width: 4px;
    height: 7px;
}

.leaf:nth-child(9) {
    background: #ffd740;
    --x: -175px;
    --y: 100px;
    --r: 380deg;
    animation-delay: 2.35s;
}

.leaf:nth-child(10) {
    background: #ff4081;
    --x: -30px;
    --y: 138px;
    --r: -470deg;
    animation-delay: 2.5s;
}

.leaf:nth-child(11) {
    background: #40c4ff;
    --x: 30px;
    --y: 105px;
    --r: 430deg;
    animation-delay: 2.15s;
}

.leaf:nth-child(12) {
    background: #69f0ae;
    --x: 175px;
    --y: 140px;
    --r: -500deg;
    animation-delay: 2.4s;
}


/* =====================================================
   سکه‌ها
   ===================================================== */

.coin {
    position: absolute;

    left: 50%;
    top: 14px;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0,
            #ffd740 45%,
            #f57c00
        );

    border: 1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 7px #ffd740,
        0 0 15px rgba(255,193,7,.7);

    opacity: 0;

    animation: coinFall 6s infinite;
}

.coin::after {
    content: "$";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 6px;
    font-weight: bold;
    color: #8d5a00;
}

.coin:nth-of-type(13) {
    --x: -145px;
    --y: 120px;
    --r: 420deg;
    animation-delay: 1.9s;
}

.coin:nth-of-type(14) {
    --x: -85px;
    --y: 100px;
    --r: -520deg;
    animation-delay: 2.05s;
}

.coin:nth-of-type(15) {
    --x: 85px;
    --y: 115px;
    --r: 480deg;
    animation-delay: 2.2s;
}

.coin:nth-of-type(16) {
    --x: 145px;
    --y: 130px;
    --r: -450deg;
    animation-delay: 2.35s;
}


/* =====================================================
   جرقه‌های انفجار
   ===================================================== */

.spark {
    position: absolute;

    left: 50%;
    top: 15px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 13px #ffd740;

    opacity: 0;

    animation: sparkBurst 6s infinite;
}

.spark:nth-of-type(17) {
    --x: -100px;
    --y: 50px;
}

.spark:nth-of-type(18) {
    --x: 100px;
    --y: 50px;
}

.spark:nth-of-type(19) {
    --x: -145px;
    --y: 75px;
}

.spark:nth-of-type(20) {
    --x: 145px;
    --y: 75px;
}


/* =====================================================
   انیمیشن تکان Gift
   ===================================================== */

@keyframes giftShake {

    0%,
    8% {
        opacity: 0;
        transform: translateX(-50%) scale(.7);
    }

    10% {
        opacity: 1;
    }

    /* تکان آرام */
    15% {
        transform:
            translateX(-50%)
            rotate(-5deg)
            scale(.9);
    }

    17% {
        transform:
            translateX(-50%)
            rotate(5deg)
            scale(.92);
    }

    19% {
        transform:
            translateX(-50%)
            rotate(-7deg)
            scale(.94);
    }

    21% {
        transform:
            translateX(-50%)
            rotate(7deg)
            scale(.96);
    }

    /* تکان شدید */
    23% {
        transform:
            translateX(-50%)
            rotate(-12deg)
            scale(1);
    }

    25% {
        transform:
            translateX(-50%)
            rotate(12deg)
            scale(1.02);
    }

    /* انفجار */
    28% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(1.5);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   باز شدن درب
   ===================================================== */

@keyframes lidOpen {

    0%,
    21% {
        transform:
            rotate(0deg)
            translateY(0);
    }

    25% {
        transform:
            rotate(-28deg)
            translate(-5px, -6px);
    }

    28%,
    100% {
        transform:
            rotate(-40deg)
            translate(-7px, -9px);
    }
}


/* =====================================================
   Flash
   ===================================================== */

@keyframes flash {

    0%,
    23% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    27% {
        opacity: .95;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    34% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(2);
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   ریزش برگ‌ها
   ===================================================== */

@keyframes leafFall {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg)
            scale(.4);
    }

    8% {
        opacity: 1;
    }

    25% {
        opacity: 1;
    }

    55% {
        opacity: .9;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * .55),
                calc(var(--y) * .45)
            )
            rotate(calc(var(--r) * .45))
            scale(1);
    }

    82% {
        opacity: .75;

        transform:
            translate(-50%, -50%)
            translate(
                var(--x),
                var(--y)
            )
            rotate(var(--r))
            scale(.8);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * 1.08),
                calc(var(--y) * 1.08)
            )
            rotate(calc(var(--r) + 180deg))
            scale(.45);
    }
}


/* =====================================================
   سقوط سکه
   ===================================================== */

@keyframes coinFall {

    0%,
    22% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    29% {
        opacity: 1;
    }

    55% {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y) * .45)
            )
            rotate(var(--r))
            scale(1);
    }

    85% {
        opacity: .7;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(.7);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(calc(var(--r) + 180deg))
            scale(.3);
    }
}


/* =====================================================
   Spark Burst
   ===================================================== */

@keyframes sparkBurst {

    0%,
    22% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    27% {
        opacity: 1;
    }

    48% {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
    }

    70% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.2);
    }

    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- ================================
     Gift بالای نوشته
     ================================ -->

<div class="gift-zone">

    <div class="flash"></div>

    <div class="gift">
        <div class="gift-box"></div>
        <div class="gift-lid"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
    </div>

</div>


<!-- ================================
     ریزش بعد از انفجار
     ================================ -->

<div class="fall-zone">

    <!-- برگ‌ها -->
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>

    <div class="leaf small"></div>
    <div class="leaf small"></div>
    <div class="leaf small"></div>
    <div class="leaf small"></div>

    <!-- سکه -->
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>
    <div class="coin"></div>

    <!-- جرقه -->
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

</div>

</body>
</html>
