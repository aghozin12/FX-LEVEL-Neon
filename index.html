<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080,initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:1920px;
    height:1080px;
    overflow:hidden;
    background:transparent;
}

/* =========================================================
   EFFECT AREA
   X: 40 → 470
   Y: 0 → 691

   Absolutely no frame / border / background.
   ========================================================= */

#celebration{
    position:absolute;
    left:40px;
    top:0;
    width:430px;
    height:691px;
    overflow:hidden;
    pointer-events:none;
    background:transparent;
    border:0;
    outline:0;
    box-shadow:none;
}

#fx{
    position:absolute;
    inset:0;
    width:430px;
    height:691px;
    display:block;
    pointer-events:none;
}

/* =========================================================
   PREMIUM GIFT
   ========================================================= */

#gift{
    position:absolute;

    left:50%;
    top:487px;

    width:64px;
    height:54px;

    transform:
        translateX(-50%)
        scale(.72);

    opacity:0;

    z-index:20;

    transform-origin:50% 100%;

    filter:
        drop-shadow(0 5px 7px rgba(0,0,0,.28))
        drop-shadow(0 0 9px rgba(255,205,85,.16));
}

/* very subtle premium aura */
#gift::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:72px;
    height:62px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:radial-gradient(
        ellipse,
        rgba(255,210,95,.16) 0%,
        rgba(255,190,50,.07) 35%,
        transparent 72%
    );

    opacity:0;

    pointer-events:none;
}

#gift.idle::after{
    animation:auraPulse 1.5s ease-in-out infinite;
}

/* =========================================================
   GIFT BODY
   ========================================================= */

.gift-body{
    position:absolute;

    left:5px;
    bottom:0;

    width:54px;
    height:37px;

    border-radius:4px 4px 7px 7px;

    background:
        linear-gradient(
            110deg,
            #54101a 0%,
            #801827 24%,
            #9d2030 48%,
            #72121f 76%,
            #460b14 100%
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.15),
        inset 0 -5px 8px rgba(0,0,0,.22),
        inset 4px 0 5px rgba(255,255,255,.035);
}

/* center ribbon */
.gift-body::before{
    content:"";

    position:absolute;

    left:22px;
    top:0;

    width:10px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #9b6815 0%,
            #d8aa43 25%,
            #ffe9a0 48%,
            #c3912c 72%,
            #79500e 100%
        );

    box-shadow:
        0 0 3px rgba(255,220,120,.18);
}

/* subtle bottom highlight */
.gift-body::after{
    content:"";

    position:absolute;

    left:7px;
    right:7px;
    bottom:3px;

    height:1px;

    background:rgba(255,225,150,.14);
}

/* =========================================================
   GIFT LID
   ========================================================= */

.gift-lid{
    position:absolute;

    left:1px;
    top:7px;

    width:62px;
    height:12px;

    border-radius:4px;

    background:
        linear-gradient(
            110deg,
            #4b0b15 0%,
            #7e1525 27%,
            #aa2636 52%,
            #72111e 78%,
            #430810 100%
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.17),
        0 2px 3px rgba(0,0,0,.22);

    transform-origin:7px 100%;
}

/* lid ribbon */
.gift-lid::after{
    content:"";

    position:absolute;

    left:25px;
    top:0;

    width:10px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #956315,
            #d9aa43,
            #ffe9a0,
            #bd8b27,
            #80550d
        );
}

/* =========================================================
   PREMIUM BOW
   Smaller / cleaner than previous version
   ========================================================= */

.bow{
    position:absolute;

    left:50%;
    top:-4px;

    width:31px;
    height:16px;

    transform:translateX(-50%);

    z-index:3;
}

.bow span{
    position:absolute;

    top:2px;

    width:15px;
    height:10px;

    background:
        linear-gradient(
            135deg,
            #fff0a6 0%,
            #e0b04b 40%,
            #a87418 100%
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.35);
}

.bow .left{
    left:1px;
    border-radius:75% 25% 65% 35%;
    transform:rotate(20deg);
}

.bow .right{
    right:1px;
    border-radius:75% 25% 65% 35%;
    transform:scaleX(-1) rotate(20deg);
}

.bow .center{
    left:11px;
    top:5px;

    width:9px;
    height:9px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 28%,
            #fff8c8 0%,
            #f4ce62 48%,
            #9d6914 100%
        );
}

/* =========================================================
   GIFT STATES
   ========================================================= */

#gift.show{
    animation:
        giftAppear
        .7s
        cubic-bezier(.16,.9,.24,1.12)
        forwards;
}

#gift.idle{
    opacity:1;
}

#gift.shake{
    animation:
        giftShake
        .92s
        cubic-bezier(.36,.07,.19,.97)
        forwards;
}

#gift.explode{
    animation:
        giftExplode
        .28s
        ease-out
        forwards;
}

#gift.explode .gift-lid{
    animation:
        lidOpen
        .34s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}

/* =========================================================
   GIFT APPEAR
   ========================================================= */

@keyframes giftAppear{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(16px)
            scale(.48)
            rotate(-4deg);
    }

    55%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(-2px)
            scale(1.05)
            rotate(.7deg);
    }

    78%{
        transform:
            translateX(-50%)
            translateY(1px)
            scale(.98)
            rotate(-.3deg);
    }

    100%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0);
    }
}

/* =========================================================
   PRE-EXPLOSION SHAKE
   Starts subtle → becomes violent
   ========================================================= */

@keyframes giftShake{

    0%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0)
            rotate(0)
            scale(1);
    }

    12%{
        transform:
            translateX(calc(-50% - 1px))
            rotate(-1deg)
            scale(1.01);
    }

    24%{
        transform:
            translateX(calc(-50% + 2px))
            rotate(1.5deg)
            scale(1.015);
    }

    36%{
        transform:
            translateX(calc(-50% - 3px))
            rotate(-2.5deg)
            scale(1.025);
    }

    48%{
        transform:
            translateX(calc(-50% + 4px))
            rotate(3deg)
            scale(1.035);
    }

    60%{
        transform:
            translateX(calc(-50% - 5px))
            rotate(-4deg)
            scale(1.045);
    }

    72%{
        transform:
            translateX(calc(-50% + 6px))
            rotate(4.5deg)
            scale(1.055);
    }

    84%{
        transform:
            translateX(calc(-50% - 4px))
            rotate(-3deg)
            scale(1.045);
    }

    94%{
        transform:
            translateX(calc(-50% + 2px))
            rotate(1.5deg)
            scale(1.025);
    }

    100%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(-1px)
            rotate(0)
            scale(1.01);
    }
}

/* =========================================================
   LID
   ========================================================= */

@keyframes lidOpen{

    0%{
        transform:
            rotate(0)
            translateY(0);
    }

    25%{
        transform:
            rotate(-9deg)
            translateY(-1px);
    }

    55%{
        transform:
            rotate(-32deg)
            translateY(-5px);
    }

    100%{
        transform:
            rotate(-64deg)
            translateY(-12px);
    }
}

/* =========================================================
   GIFT EXPLODE
   ========================================================= */

@keyframes giftExplode{

    0%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.02);
    }

    45%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.09);
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(1.2);
    }
}

/* =========================================================
   AURA
   ========================================================= */

@keyframes auraPulse{

    0%,
    100%{
        opacity:.15;
        transform:translate(-50%,-50%) scale(.9);
    }

    50%{
        opacity:.42;
        transform:translate(-50%,-50%) scale(1.12);
    }
}

/* =========================================================
   WIN BADGE
   ========================================================= */

#winText{
    position:absolute;

    left:50%;
    top:510px;

    transform:
        translate(-50%,18px)
        scale(.55);

    opacity:0;

    z-index:30;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:25px;
    font-weight:900;

    font-style:italic;

    letter-spacing:3px;

    color:#fff7cf;

    text-shadow:
        0 1px 0 #fff,
        0 2px 5px rgba(0,0,0,.42),
        0 0 8px rgba(255,213,75,.8),
        0 0 18px rgba(255,174,30,.38);

    white-space:nowrap;

    pointer-events:none;
}

#winText.show{
    animation:
        winRise
        .95s
        cubic-bezier(.16,.9,.25,1.18)
        forwards;
}

#winText::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:68px;
    height:30px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:radial-gradient(
        ellipse,
        rgba(255,205,60,.28),
        transparent 70%
    );

    filter:blur(4px);

    z-index:-1;
}

@keyframes winRise{

    0%{
        opacity:0;
        transform:
            translate(-50%,18px)
            scale(.55);
        filter:blur(3px);
    }

    32%{
        opacity:1;
        transform:
            translate(-50%,-7px)
            scale(1.13);
        filter:blur(0);
    }

    55%{
        transform:
            translate(-50%,1px)
            scale(.96);
    }

    75%{
        transform:
            translate(-50%,-1px)
            scale(1.04);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-2px)
            scale(1);
    }
}

#winText.fade{
    animation:
        winFade
        .7s
        ease-out
        forwards;
}

@keyframes winFade{

    0%{
        opacity:1;
        transform:
            translate(-50%,-2px)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-14px)
            scale(.92);
        filter:blur(2px);
    }
}

/* =========================================================
   FLASH
   ========================================================= */

#flash{
    position:absolute;

    left:50%;
    top:514px;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fffbe0;

    transform:translate(-50%,-50%) scale(0);

    opacity:0;

    z-index:25;

    box-shadow:
        0 0 12px rgba(255,240,150,.95),
        0 0 28px rgba(255,195,45,.7),
        0 0 60px rgba(255,170,20,.45);
}

#flash.fire{
    animation:
        flashBurst
        .32s
        ease-out
        forwards;
}

@keyframes flashBurst{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }

    18%{
        opacity:1;
        transform:translate(-50%,-50%) scale(3);
    }

    45%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(7);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(15);
    }
}
</style>
</head>

<body>

<div id="celebration">

    <canvas
        id="fx"
        width="860"
        height="1382">
    </canvas>

    <div id="flash"></div>

    <div id="winText">WIN</div>

    <div id="gift">

        <div class="gift-lid"></div>

        <div class="bow">
            <span class="left"></span>
            <span class="right"></span>
            <span class="center"></span>
        </div>

        <div class="gift-body"></div>

    </div>

</div>

<script>
/* =========================================================
   PREMIUM WIN GIFT CELEBRATION
   ========================================================= */

const canvas =
    document.getElementById("fx");

const ctx =
    canvas.getContext("2d");

const gift =
    document.getElementById("gift");

const winText =
    document.getElementById("winText");

const flash =
    document.getElementById("flash");

const W = 430;
const H = 691;

const DPR = 2;

const EXPLOSION_X = W / 2;
const EXPLOSION_Y = 514;

let particles = [];
let sparks = [];
let rings = [];

let previous =
    performance.now();

let running = false;


/* =========================================================
   HELPERS
   ========================================================= */

function random(min,max){
    return Math.random() *
        (max-min) + min;
}

function clamp(value,min,max){
    return Math.max(
        min,
        Math.min(max,value)
    );
}


/* =========================================================
   PARTICLE
   ========================================================= */

class Particle{

    constructor(type,x,y){

        this.type = type;

        this.x = x;
        this.y = y;

        /*
         * Mostly upward launch.
         * Wider spread on the sides.
         */

        const angle =
            random(
                Math.PI * 1.18,
                Math.PI * 1.82
            );

        let speed;

        if(type === "coin"){
            speed = random(190,285);
        }
        else if(type === "confetti"){
            speed = random(145,225);
        }
        else{
            speed = random(240,355);
        }

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        /*
         * Slight individual gravity.
         */

        if(type === "coin"){
            this.gravity =
                random(220,285);
        }
        else if(type === "confetti"){
            this.gravity =
                random(185,245);
        }
        else{
            this.gravity =
                random(80,150);
        }

        this.drag =
            type === "coin"
                ? random(.990,.996)
                : random(.987,.995);

        /*
         * Individual size.
         */

        if(type === "coin"){
            this.size =
                random(7,11.5);
        }
        else if(type === "confetti"){
            this.size =
                random(3.5,6.5);
        }
        else{
            this.size =
                random(3,7);
        }

        this.rotation =
            random(
                0,
                Math.PI*2
            );

        this.rotationSpeed =
            random(-14,14);

        this.life = 0;

        if(type === "coin"){
            this.maxLife =
                random(3.2,4.25);
        }
        else if(type === "confetti"){
            this.maxLife =
                random(3.0,4.0);
        }
        else{
            this.maxLife =
                random(.55,1.35);
        }

        /*
         * Soft horizontal wave.
         */

        this.wave =
            random(0,Math.PI*2);

        this.waveSpeed =
            random(1.8,4.8);

        this.waveAmount =
            random(2,10);

        this.alpha = 1;
    }


    update(dt){

        this.life += dt;

        /*
         * Gravity.
         */

        this.vy +=
            this.gravity * dt;

        /*
         * Air resistance.
         */

        this.vx *=
            Math.pow(
                this.drag,
                dt*60
            );

        this.vy *=
            Math.pow(
                this.drag,
                dt*60
            );

        /*
         * Horizontal movement.
         */

        this.x +=
            this.vx * dt;

        this.x +=
            Math.sin(
                this.life *
                this.waveSpeed +
                this.wave
            ) *
            this.waveAmount *
            dt;

        /*
         * Vertical movement.
         */

        this.y +=
            this.vy * dt;

        /*
         * Rotation.
         */

        this.rotation +=
            this.rotationSpeed * dt;

        /*
         * Fade close to the lower boundary.
         */

        if(
            this.y > 600 ||
            this.life >
                this.maxLife - .55
        ){

            const bottomFade =
                clamp(
                    (691-this.y)/75,
                    0,
                    1
                );

            const lifeFade =
                clamp(
                    (this.maxLife-this.life)/.55,
                    0,
                    1
                );

            this.alpha =
                Math.min(
                    bottomFade,
                    lifeFade
                );
        }

        /*
         * Hard safety boundary.
         */

        if(this.y >= 685){

            this.y = 685;

            this.vy *= -.10;

            this.alpha *= .45;
        }

        /*
         * Horizontal safety.
         */

        if(this.x < -45){

            this.x = -45;

            this.vx *= -.25;
        }

        if(this.x > W+45){

            this.x = W+45;

            this.vx *= -.25;
        }

        return(
            this.life <
            this.maxLife &&
            this.alpha > .01
        );
    }


    draw(){

        ctx.save();

        ctx.globalAlpha =
            this.alpha;

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        if(this.type === "coin"){
            this.drawCoin();
        }
        else if(this.type === "confetti"){
            this.drawConfetti();
        }
        else{
            this.drawSpark();
        }

        ctx.restore();
    }


    /* =====================================================
       PREMIUM COIN
       ===================================================== */

    drawCoin(){

        /*
         * Ellipse width changes during spin.
         */

        const spin =
            Math.abs(
                Math.cos(
                    this.rotation*.7
                )
            );

        const width =
            this.size *
            (.18 + spin*.82);

        const height =
            this.size*1.18;

        /*
         * Small motion trail.
         */

        if(Math.abs(this.vy) > 90){

            ctx.globalAlpha *= .13;

            ctx.fillStyle =
                "#ffd96a";

            ctx.beginPath();

            ctx.ellipse(
                -this.vx*.018,
                -this.vy*.018,
                width*1.15,
                height*1.45,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.globalAlpha =
                this.alpha;
        }

        const gradient =
            ctx.createRadialGradient(
                -width*.3,
                -height*.35,
                1,
                0,
                0,
                height
            );

        gradient.addColorStop(
            0,
            "#fff8ce"
        );

        gradient.addColorStop(
            .25,
            "#ffe77a"
        );

        gradient.addColorStop(
            .58,
            "#e8b83f"
        );

        gradient.addColorStop(
            .86,
            "#b77913"
        );

        gradient.addColorStop(
            1,
            "#75470a"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            width,
            height,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle =
            "rgba(255,245,180,.9)";

        ctx.lineWidth = .8;

        ctx.stroke();

        /*
         * Dollar mark only when
         * the coin faces the camera.
         */

        if(spin > .55){

            ctx.save();

            ctx.scale(
                Math.max(.25,spin),
                1
            );

            ctx.fillStyle =
                "rgba(105,65,8,.7)";

            ctx.font =
                `900 ${Math.max(
                    6,
                    this.size*.72
                )}px Arial`;

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "$",
                0,
                0
            );

            ctx.restore();
        }
    }


    /* =====================================================
       CONFETTI
       ===================================================== */

    drawConfetti(){

        ctx.fillStyle =
            this.color ||
            "#e9bd55";

        ctx.globalAlpha *= .82;

        ctx.fillRect(
            -this.size/2,
            -this.size,
            this.size,
            this.size*2.2
        );
    }


    /* =====================================================
       SPARK
       ===================================================== */

    drawSpark(){

        const s =
            this.size;

        ctx.fillStyle =
            "rgba(255,249,215,.95)";

        ctx.shadowColor =
            "rgba(255,211,77,.9)";

        ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.moveTo(
            0,
            -s*1.8
        );

        ctx.lineTo(
            s*.28,
            -s*.28
        );

        ctx.lineTo(
            s*1.8,
            0
        );

        ctx.lineTo(
            s*.28,
            s*.28
        );

        ctx.lineTo(
            0,
            s*1.8
        );

        ctx.lineTo(
            -s*.28,
            s*.28
        );

        ctx.lineTo(
            -s*1.8,
            0
        );

        ctx.lineTo(
            -s*.28,
            -s*.28
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   EXPLOSION
   ========================================================= */

function createExplosion(){

    /*
     * COINS
     */

    for(let i=0;i<24;i++){

        const p =
            new Particle(
                "coin",
                EXPLOSION_X+
                    random(-8,8),
                EXPLOSION_Y+
                    random(-4,4)
            );

        /*
         * A few coins get extra lift.
         */

        if(i < 7){

            p.vy *=
                random(1.12,1.3);

            p.vx *=
                random(.8,1.15);
        }

        particles.push(p);
    }


    /*
     * CONFETTI
     */

    const colors = [
        "#d8b04e",
        "#f4d77d",
        "#ffffff",
        "#9f2333",
        "#e5c86a",
        "#b9a0ff"
    ];

    for(let i=0;i<25;i++){

        const p =
            new Particle(
                "confetti",
                EXPLOSION_X+
                    random(-7,7),
                EXPLOSION_Y+
                    random(-4,4)
            );

        p.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        p.size =
            random(3.5,6);

        p.maxLife =
            random(2.7,3.8);

        particles.push(p);
    }


    /*
     * FAST SPARKS
     */

    for(let i=0;i<34;i++){

        const p =
            new Particle(
                "spark",
                EXPLOSION_X+
                    random(-4,4),
                EXPLOSION_Y+
                    random(-3,3)
            );

        p.maxLife =
            random(.45,1.15);

        p.gravity =
            random(70,140);

        p.vx *=
            random(.85,1.45);

        p.vy *=
            random(.9,1.3);

        sparks.push(p);
    }


    /*
     * SHOCKWAVES
     */

    rings.push({
        x:EXPLOSION_X,
        y:EXPLOSION_Y,
        radius:3,
        alpha:.9,
        life:0,
        maxLife:.34
    });

    rings.push({
        x:EXPLOSION_X,
        y:EXPLOSION_Y,
        radius:2,
        alpha:.45,
        life:0,
        maxLife:.62
    });
}


/* =========================================================
   RENDER
   ========================================================= */

function render(now){

    const dt =
        Math.min(
            (now-previous)/1000,
            .033
        );

    previous = now;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    /*
     * 2x render for sharp OBS output.
     */

    ctx.scale(
        DPR,
        DPR
    );


    /*
     * MAIN PARTICLES
     */

    particles =
        particles.filter(
            particle => {

                const alive =
                    particle.update(dt);

                if(alive){
                    particle.draw();
                }

                return alive;
            }
        );


    /*
     * SPARKS
     */

    sparks =
        sparks.filter(
            spark => {

                const alive =
                    spark.update(dt);

                if(alive){
                    spark.draw();
                }

                return alive;
            }
        );


    /*
     * RINGS
     */

    rings =
        rings.filter(
            ring => {

                ring.life += dt;

                const progress =
                    ring.life /
                    ring.maxLife;

                ring.radius +=
                    190*dt;

                ring.alpha =
                    .82 *
                    (1-progress);

                if(ring.alpha > 0){

                    ctx.beginPath();

                    ctx.arc(
                        ring.x,
                        ring.y,
                        ring.radius,
                        0,
                        Math.PI*2
                    );

                    ctx.strokeStyle =
                        `rgba(
                            255,
                            220,
                            105,
                            ${ring.alpha}
                        )`;

                    ctx.lineWidth =
                        2.2 *
                        (1-progress);

                    ctx.shadowColor =
                        "rgba(255,205,70,.7)";

                    ctx.shadowBlur = 8;

                    ctx.stroke();
                }

                return(
                    ring.life <
                    ring.maxLife
                );
            }
        );

    ctx.restore();

    requestAnimationFrame(render);
}


/* =========================================================
   RESET
   ========================================================= */

function resetGift(){

    gift.classList.remove(
        "show",
        "idle",
        "shake",
        "explode"
    );

    winText.classList.remove(
        "show",
        "fade"
    );

    flash.classList.remove(
        "fire"
    );

    /*
     * Force CSS animation reset.
     */

    void gift.offsetWidth;
    void winText.offsetWidth;
    void flash.offsetWidth;

    gift.classList.add("show");
}


/* =========================================================
   MAIN CELEBRATION
   ========================================================= */

function playCelebration(){

    if(running){
        return;
    }

    running = true;

    particles.length = 0;
    sparks.length = 0;
    rings.length = 0;

    resetGift();


    /*
     * Gift settles first.
     */

    setTimeout(()=>{

        gift.classList.add("idle");

    },720);


    /*
     * BUILD-UP
     *
     * The box remains completely visible.
     */

    setTimeout(()=>{

        gift.classList.remove("idle");

        gift.classList.add("shake");

    },3500);


    /*
     * EXPLOSION
     */

    setTimeout(()=>{

        gift.classList.remove("shake");

        gift.classList.add("explode");

        /*
         * Open the lid and trigger
         * the actual explosion.
         */

        flash.classList.add("fire");

        createExplosion();

        /*
         * WIN emerges from the box.
         */

        winText.classList.add("show");

    },4420);


    /*
     * WIN remains visible briefly.
     */

    setTimeout(()=>{

        winText.classList.remove("show");

        winText.classList.add("fade");

    },7000);


    /*
     * Full empty gap before next Gift.
     */

    setTimeout(()=>{

        running = false;

        playCelebration();

    },14000);
}


/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(render);

setTimeout(()=>{

    playCelebration();

},900);

</script>
