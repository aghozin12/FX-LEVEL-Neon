<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: transparent;
}

/* فقط محدوده افکت‌های بالایی */
#celebration {
  position: absolute;
  left: 40px;
  top: 0;
  width: 430px;
  height: 691px;

  overflow: hidden;
  pointer-events: none;

  background: transparent;
  border: 0;
  outline: 0;
  box-shadow: none;
}

/* Canvas */
#fx {
  position: absolute;
  left: 0;
  top: 0;

  width: 430px;
  height: 691px;

  display: block;
  pointer-events: none;
}

/* =========================================================
   GIFT
========================================================= */

#gift {
  position: absolute;

  left: 50%;
  top: 487px;

  width: 58px;
  height: 51px;

  opacity: 0;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);

  transform-origin: 50% 100%;

  z-index: 20;

  filter:
    drop-shadow(0 4px 8px rgba(0,0,0,.25))
    drop-shadow(0 0 10px rgba(255,190,40,.25));
}

/* این کلاس باعث می‌شود جعبه هنگام Shake غیب نشود */
#gift.visible {
  opacity: 1;
}

/* =========================================================
   GIFT BODY
========================================================= */

.gift-body {
  position: absolute;

  left: 4px;
  right: 4px;
  bottom: 0;

  height: 37px;

  border-radius: 4px;

  background:
    linear-gradient(
      90deg,
      #a90018 0%,
      #ed1738 38%,
      #c90020 65%,
      #8f0015 100%
    );

  border: 2px solid #8d0014;

  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.18),
    inset 0 -5px 8px rgba(0,0,0,.18);
}

/* روبان عمودی */
.gift-body::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 9px;
  height: 100%;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #d99b16,
      #ffe06a,
      #c9850c
    );

  box-shadow:
    0 0 2px rgba(255,220,80,.7);
}

/* =========================================================
   GIFT LID
========================================================= */

.gift-lid {
  position: absolute;

  left: 0;
  top: 5px;

  width: 58px;
  height: 13px;

  border-radius: 4px;

  background:
    linear-gradient(
      90deg,
      #9d0018 0%,
      #f0193b 38%,
      #cf0825 70%,
      #8e0014 100%
    );

  border: 2px solid #870013;

  transform-origin: 50% 100%;

  z-index: 5;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.18),
    0 2px 4px rgba(0,0,0,.18);
}

/* روبان روی در */
.gift-lid::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -2px;

  width: 9px;
  height: 13px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #d99b16,
      #ffe06a,
      #c9850c
    );
}

/* =========================================================
   BOW
========================================================= */

.bow {
  position: absolute;

  left: 50%;
  top: 0;

  width: 28px;
  height: 20px;

  transform: translateX(-50%);

  z-index: 10;
}

.bow span {
  position: absolute;

  display: block;

  background:
    linear-gradient(
      135deg,
      #c9850c,
      #ffe06a,
      #d99b16
    );

  border: 1px solid #b27608;

  box-shadow:
    0 1px 2px rgba(0,0,0,.2);
}

.bow .left {
  left: 0;
  top: 1px;

  width: 15px;
  height: 11px;

  border-radius: 10px 3px 8px 5px;

  transform: rotate(18deg);
}

.bow .right {
  right: 0;
  top: 1px;

  width: 15px;
  height: 11px;

  border-radius: 3px 10px 5px 8px;

  transform: rotate(-18deg);
}

.bow .center {
  left: 50%;
  top: 5px;

  width: 8px;
  height: 8px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff3a0,
      #e0a21c 55%,
      #a76a05
    );
}

/* =========================================================
   GIFT APPEAR
========================================================= */

#gift.show {
  animation:
    giftShow
    0.65s
    cubic-bezier(.22,.8,.3,1)
    forwards;
}

@keyframes giftShow {

  0% {
    opacity: 0;

    transform:
      translateX(-50%)
      translateY(12px)
      scale(.65);
  }

  65% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(-3px)
      scale(1.06);
  }

  100% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }
}

/* =========================================================
   GIFT SHAKE
========================================================= */

#gift.shake {
  animation:
    giftShake
    0.8s
    ease-in-out
    forwards;
}

@keyframes giftShake {

  0% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  10% {
    transform:
      translateX(calc(-50% - 3px))
      translateY(-1px)
      rotate(-5deg)
      scale(1.01);
  }

  20% {
    transform:
      translateX(calc(-50% + 3px))
      translateY(0)
      rotate(5deg)
      scale(1.015);
  }

  30% {
    transform:
      translateX(calc(-50% - 4px))
      translateY(-1px)
      rotate(-6deg)
      scale(1.02);
  }

  40% {
    transform:
      translateX(calc(-50% + 4px))
      translateY(0)
      rotate(6deg)
      scale(1.02);
  }

  50% {
    transform:
      translateX(calc(-50% - 3px))
      translateY(-1px)
      rotate(-5deg)
      scale(1.015);
  }

  60% {
    transform:
      translateX(calc(-50% + 3px))
      translateY(0)
      rotate(5deg)
      scale(1.01);
  }

  70% {
    transform:
      translateX(calc(-50% - 2px))
      translateY(0)
      rotate(-3deg)
      scale(1.005);
  }

  80% {
    transform:
      translateX(calc(-50% + 2px))
      translateY(0)
      rotate(3deg)
      scale(1);
  }

  90% {
    transform:
      translateX(-50%)
      translateY(0)
      rotate(-1deg)
      scale(1);
  }

  100% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      rotate(0deg)
      scale(1);
  }
}

/* =========================================================
   LID OPEN
========================================================= */

#gift.explode .gift-lid {
  animation:
    lidOpen
    0.35s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}

@keyframes lidOpen {

  0% {
    transform:
      rotate(0deg)
      translateY(0);
  }

  45% {
    transform:
      rotate(-28deg)
      translateY(-7px);
  }

  100% {
    transform:
      rotate(-58deg)
      translateY(-13px);
  }
}

/* =========================================================
   GIFT EXPLODE
========================================================= */

#gift.explode {
  animation:
    giftExplode
    0.35s
    ease-out
    forwards;
}

@keyframes giftExplode {

  0% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }

  35% {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(-4px)
      scale(1.12);
  }

  100% {
    opacity: 0;

    transform:
      translateX(-50%)
      translateY(-8px)
      scale(1.25);
  }
}

/* =========================================================
   JAVASCRIPT
========================================================= */
</style>
</head>

<body>

<div id="celebration">

  <canvas id="fx" width="860" height="1382"></canvas>

  <div id="gift">

    <div class="gift-lid"></div>

    <div class="bow">
      <span class="left"></span>
      <span class="right"></span>
      <span class="center"></span>
    </div>

    <div class="gift-body"></div>

  </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const W = 430;
const H = 691;
const DPR = 2;

const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

const gift = document.getElementById("gift");

ctx.scale(DPR, DPR);

/*
  مرکز انفجار
  داخل محدوده بالایی
*/
const EXPLOSION_X = W / 2;
const EXPLOSION_Y = 514;


/*
  جعبه:
  3.8 ثانیه دیده می‌شود
*/
const GIFT_WAIT = 3800;


/*
  بعد از آن 0.8 ثانیه می‌لرزد
*/
const SHAKE_TIME = 800;


/*
  زمان انفجار
*/
const EXPLOSION_DELAY =
  GIFT_WAIT + SHAKE_TIME;


/*
  کل سیکل:

  0s      جعبه ظاهر می‌شود
  0.65s   کامل ظاهر شده
  3.8s    شروع لرزش
  4.6s    انفجار
  ~8s     پایان ذرات
  13.5s   جعبه بعدی

  یعنی حدود 5.5 ثانیه فاصله خالی
*/
const FULL_CYCLE = 13500;


/* =========================================================
   ARRAYS
========================================================= */

const particles = [];
const sparks = [];
const rings = [];


/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
  return Math.floor(random(min, max + 1));
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

  constructor(type, x, y) {

    this.type = type;

    this.x = x;
    this.y = y;

    /*
      پرتاب عمدتاً رو به بالا
    */
    const angle =
      random(
        Math.PI * 1.18,
        Math.PI * 1.82
      );

    let speed;

    if (type === "coin") {
      speed = random(175, 250);
    }
    else {
      speed = random(150, 235);
    }

    this.vx =
      Math.cos(angle) * speed;

    this.vy =
      Math.sin(angle) * speed;

    /*
      جاذبه
    */
    this.gravity =
      random(250, 320);

    /*
      مقاومت هوا
    */
    this.drag =
      random(.982, .992);

    /*
      موج افقی
    */
    this.wave =
      random(.8, 2.0);

    this.waveAmp =
      random(8, 22);

    this.wavePhase =
      random(0, Math.PI * 2);

    /*
      اندازه
    */
    if (type === "coin") {
      this.size =
        random(7, 12);
    }
    else if (type === "confetti") {
      this.size =
        random(5, 10);
    }
    else {
      this.size =
        random(2, 5);
    }

    /*
      عمر
    */
    if (type === "coin") {
      this.life =
        random(3.0, 3.8);
    }
    else if (type === "confetti") {
      this.life =
        random(2.8, 3.7);
    }
    else {
      this.life =
        random(.8, 1.6);
    }

    this.maxLife = this.life;

    /*
      چرخش
    */
    this.rotation =
      random(0, Math.PI * 2);

    this.rotationSpeed =
      random(-8, 8);

    /*
      برای Coin
    */
    this.spin =
      random(-9, 9);

    /*
      رنگ
    */
    const colors = [
      "#FFD84A",
      "#FFC928",
      "#FFEC79",
      "#FFB700",
      "#FFF1A8"
    ];

    const confettiColors = [
      "#FF405A",
      "#FFD83D",
      "#4DE1FF",
      "#8C5CFF",
      "#55F08A",
      "#FF7A32"
    ];

    if (type === "coin") {
      this.color =
        colors[
          randomInt(0, colors.length - 1)
        ];
    }
    else if (type === "confetti") {
      this.color =
        confettiColors[
          randomInt(
            0,
            confettiColors.length - 1
          )
        ];
    }
    else {
      this.color = "#FFE878";
    }
  }


  update(dt) {

    this.life -= dt;

    /*
      موج نرم افقی
    */
    const waveX =
      Math.sin(
        this.wavePhase +
        (this.maxLife - this.life) *
        this.wave
      ) *
      this.waveAmp *
      dt;

    this.x +=
      this.vx * dt +
      waveX;

    this.y +=
      this.vy * dt;

    /*
      جاذبه
    */
    this.vy +=
      this.gravity * dt;

    /*
      مقاومت
    */
    this.vx *=
      Math.pow(this.drag, dt * 60);

    /*
      چرخش
    */
    this.rotation +=
      this.rotationSpeed * dt;

    /*
      مرز پایین
    */
    if (this.y > H - 5) {

      this.y = H - 5;

      /*
        آرام شدن نزدیک پایین
      */
      this.vy *= -0.12;
      this.vx *= .88;
    }

    /*
      مرز افقی
    */
    if (this.x < -40) {
      this.x = -40;
      this.vx *= -0.35;
    }

    if (this.x > W + 40) {
      this.x = W + 40;
      this.vx *= -0.35;
    }
  }


  alpha() {

    let a =
      clamp(
        this.life / this.maxLife,
        0,
        1
      );

    /*
      Fade نزدیک پایین
    */
    if (this.y > 610) {

      a *=
        clamp(
          (686 - this.y) / 76,
          0,
          1
        );
    }

    /*
      پایان عمر
    */
    if (this.life < .5) {

      a *=
        clamp(
          this.life / .5,
          0,
          1
        );
    }

    return a;
  }


  draw(ctx) {

    const a = this.alpha();

    if (a <= 0) return;

    ctx.save();

    ctx.globalAlpha = a;

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.rotation
    );


    /* =========================
       COIN
    ========================= */

    if (this.type === "coin") {

      /*
        شبیه‌سازی چرخش سه‌بعدی
      */
      const spinScale =
        Math.cos(
          this.rotation * 1.7
        );

      ctx.scale(
        Math.max(.18, Math.abs(spinScale)),
        1
      );

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        this.size,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        this.color;

      ctx.fill();

      ctx.lineWidth = 1.5;

      ctx.strokeStyle =
        "#A86A00";

      ctx.stroke();


      /*
        $
      */
      ctx.fillStyle =
        "#9A6100";

      ctx.font =
        `bold ${this.size * 1.15}px Arial`;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        "$",
        0,
        1
      );
    }


    /* =========================
       CONFETTI
    ========================= */

    else if (this.type === "confetti") {

      ctx.fillStyle =
        this.color;

      ctx.fillRect(
        -this.size * .55,
        -this.size * .25,
        this.size * 1.1,
        this.size * .5
      );
    }


    /* =========================
       SPARK
    ========================= */

    else {

      ctx.strokeStyle =
        this.color;

      ctx.lineWidth =
        2;

      ctx.beginPath();

      ctx.moveTo(
        -this.size * 2,
        0
      );

      ctx.lineTo(
        this.size * 2,
        0
      );

      ctx.moveTo(
        0,
        -this.size * 2
      );

      ctx.lineTo(
        0,
        this.size * 2
      );

      ctx.stroke();
    }

    ctx.restore();
  }
}


/* =========================================================
   CREATE EXPLOSION
========================================================= */

function createExplosion() {

  /*
    COINS
  */
  for (let i = 0; i < 18; i++) {

    particles.push(
      new Particle(
        "coin",
        EXPLOSION_X +
          random(-8, 8),

        EXPLOSION_Y +
          random(-5, 5)
      )
    );
  }


  /*
    CONFETTI
  */
  for (let i = 0; i < 22; i++) {

    particles.push(
      new Particle(
        "confetti",
        EXPLOSION_X +
          random(-12, 12),

        EXPLOSION_Y +
          random(-8, 8)
      )
    );
  }


  /*
    SPARKS
  */
  for (let i = 22; i--;) {

    const p =
      new Particle(
        "spark",
        EXPLOSION_X +
          random(-5, 5),

        EXPLOSION_Y +
          random(-5, 5)
      );

    p.life =
      random(.55, 1.15);

    p.maxLife =
      p.life;

    particles.push(p);
  }


  /*
    انفجار نور
  */
  rings.push({
    x: EXPLOSION_X,
    y: EXPLOSION_Y,
    r: 4,
    life: .55,
    maxLife: .55
  });

  rings.push({
    x: EXPLOSION_X,
    y: EXPLOSION_Y,
    r: 8,
    life: .35,
    maxLife: .35
  });
}


/* =========================================================
   RENDER
========================================================= */

let lastTime =
  performance.now();


function render(now) {

  let dt =
    (now - lastTime) / 1000;

  lastTime = now;

  dt =
    Math.min(dt, .033);


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    PARTICLES
  */

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p =
      particles[i];

    p.update(dt);
    p.draw(ctx);

    if (
      p.life <= 0 ||
      p.y >= H + 20
    ) {

      particles.splice(i, 1);
    }
  }


  /*
    EXPLOSION RINGS
  */

  for (
    let i = rings.length - 1;
    i >= 0;
    i--
  ) {

    const ring =
      rings[i];

    ring.life -= dt;

    ring.r +=
      150 * dt;

    const alpha =
      clamp(
        ring.life /
        ring.maxLife,
        0,
        1
      );

    ctx.save();

    ctx.globalAlpha =
      alpha * .55;

    ctx.strokeStyle =
      "#FFE36A";

    ctx.lineWidth =
      3;

    ctx.beginPath();

    ctx.arc(
      ring.x,
      ring.y,
      ring.r,
      0,
      Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();


    if (ring.life <= 0) {

      rings.splice(i, 1);
    }
  }


  requestAnimationFrame(render);
}


/* =========================================================
   CELEBRATION LOOP
========================================================= */

function playCelebration() {

  /*
    همه چیز reset
  */
  gift.classList.remove(
    "visible",
    "show",
    "shake",
    "explode"
  );

  /*
    اجبار مرورگر به اجرای دوباره Animation
  */
  void gift.offsetWidth;


  /*
    پاک کردن انفجار قبلی
  */
  particles.length = 0;
  sparks.length = 0;
  rings.length = 0;


  /*
    مرحله 1:
    جعبه ظاهر می‌شود
  */
  gift.classList.add(
    "visible",
    "show"
  );


  /*
    مرحله 2:
    بعد از 3.8 ثانیه شروع به لرزش می‌کند
  */
  setTimeout(() => {

    gift.classList.remove(
      "show"
    );

    /*
      visible باقی می‌ماند
      بنابراین جعبه غیب نمی‌شود
    */
    gift.classList.add(
      "shake"
    );

  }, GIFT_WAIT);


  /*
    مرحله 3:
    بعد از پایان لرزش انفجار
  */
  setTimeout(() => {

    gift.classList.remove(
      "shake",
      "visible"
    );

    gift.classList.add(
      "explode"
    );

    createExplosion();

  }, EXPLOSION_DELAY);


  /*
    مرحله 4:
    تکرار بعد از فاصله خالی
  */
  setTimeout(() => {

    playCelebration();

  }, FULL_CYCLE);
}


/* =========================================================
   START
========================================================= */

requestAnimationFrame(render);

/*
  کمی تأخیر در اولین اجرا
*/
setTimeout(() => {

  playCelebration();

}, 800);

</script>

</body>
</html>
