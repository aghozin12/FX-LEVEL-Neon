<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
}

/* =========================================================
   INVISIBLE EFFECT AREA

   X: 40 → 470
   TOP: 0
   BOTTOM: 691

   The upper part is completely open so particles
   can fly high and remain visible.

   Nothing is drawn here except the animation.
   ========================================================= */

#celebration {
    position: absolute;

    left: 40px;
    top: 0;

    width: 430px;
    height: 691px;

    overflow: hidden;

    pointer-events: none;

    background: transparent;
    border: 0;
    outline: 0;
    box-shadow: none;
}

/* =========================================================
   CANVAS
   ========================================================= */

#fx {
    position: absolute;

    left: 0;
    top: 0;

    width: 430px;
    height: 691px;

    display: block;

    pointer-events: none;
}

/* =========================================================
   GIFT
   ========================================================= */

#gift {
    position: absolute;

    left: 50%;
    top: 487px;

    width: 58px;
    height: 51px;

    transform:
        translateX(-50%)
        scale(.75);

    opacity: 0;

    z-index: 10;

    transform-origin: 50% 100%;

    filter:
        drop-shadow(0 4px 8px rgba(0,0,0,.25))
        drop-shadow(0 0 10px rgba(255,190,40,.25));
}

/* =========================================================
   GIFT BODY
   ========================================================= */

.gift-body {
    position: absolute;

    left: 5px;
    bottom: 0;

    width: 48px;
    height: 34px;

    border-radius: 3px 3px 6px 6px;

    background:
        linear-gradient(
            90deg,
            #b70e20 0%,
            #ed263b 35%,
            #ff3c4d 52%,
            #c50f22 100%
        );

    box-shadow:
        inset 0 2px rgba(255,255,255,.16),
        inset 0 -4px rgba(0,0,0,.15);
}

/* Vertical ribbon */

.gift-body::before {
    content: "";

    position: absolute;

    left: 19px;
    top: 0;

    width: 10px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #d99c0d,
            #ffe15a,
            #fff2a0,
            #d99c0d
        );
}

/* =========================================================
   GIFT LID
   ========================================================= */

.gift-lid {
    position: absolute;

    left: 1px;
    top: 8px;

    width: 56px;
    height: 11px;

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #c71124,
            #ff4050,
            #c71124
        );

    transform-origin: 7px 100%;
}

.gift-lid::after {
    content: "";

    position: absolute;

    left: 22px;
    top: 0;

    width: 10px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #d99c0d,
            #ffe15a,
            #fff0a0,
            #d99c0d
        );
}

/* =========================================================
   BOW
   ========================================================= */

.bow {
    position: absolute;

    left: 50%;
    top: -2px;

    width: 30px;
    height: 17px;

    transform: translateX(-50%);
}

.bow span {
    position: absolute;

    top: 2px;

    width: 16px;
    height: 11px;

    background:
        linear-gradient(
            135deg,
            #fff18a,
            #ffc928,
            #d99b0b
        );

    border-radius: 80% 20% 70% 30%;
}

.bow .left {
    left: 0;

    transform:
        rotate(24deg);
}

.bow .right {
    right: 0;

    transform:
        scaleX(-1)
        rotate(24deg);
}

.bow .center {
    left: 11px;
    top: 5px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff9bc,
            #ffd52f 55%,
            #d89500
        );
}

/* =========================================================
   GIFT ANIMATION
   ========================================================= */

#gift.show {
    animation:
        giftAppear .65s
        cubic-bezier(.18,.9,.25,1.25)
        forwards;
}

#gift.shake {
    animation:
        giftShake .5s
        ease-in-out;
}

#gift.explode {
    animation:
        giftDisappear .32s
        ease-out
        forwards;
}

#gift.explode .gift-lid {
    animation:
        lidOpen .34s
        cubic-bezier(.2,.9,.25,1)
        forwards;
}

/* =========================================================
   GIFT APPEAR
   ========================================================= */

@keyframes giftAppear {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(12px)
            scale(.55)
            rotate(-5deg);
    }

    65% {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(-2px)
            scale(1.06)
            rotate(1deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0);
    }
}

/* =========================================================
   GIFT SHAKE
   ========================================================= */

@keyframes giftShake {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0);
    }

    20% {
        transform:
            translateX(calc(-50% - 3px))
            rotate(-4deg)
            scale(1.02);
    }

    40% {
        transform:
            translateX(calc(-50% + 3px))
            rotate(4deg)
            scale(1.04);
    }

    60% {
        transform:
            translateX(calc(-50% - 2px))
            rotate(-3deg)
            scale(1.02);
    }

    80% {
        transform:
            translateX(calc(-50% + 2px))
            rotate(2deg)
            scale(1.03);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(0)
            scale(1);
    }
}

/* =========================================================
   LID OPEN
   ========================================================= */

@keyframes lidOpen {

    0% {
        transform:
            rotate(0)
            translateY(0);
    }

    45% {
        transform:
            rotate(-18deg)
            translateY(-3px);
    }

    100% {
        transform:
            rotate(-55deg)
            translateY(-11px);
    }
}

/* =========================================================
   GIFT DISAPPEAR
   ========================================================= */

@keyframes giftDisappear {

    0% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-50%)
            scale(1.18);
    }
}
</style>
</head>

<body>

<div id="celebration">

    <canvas
        id="fx"
        width="860"
        height="1382">
    </canvas>

    <div id="gift">

        <div class="gift-lid"></div>

        <div class="bow">
            <span class="left"></span>
            <span class="right"></span>
            <span class="center"></span>
        </div>

        <div class="gift-body"></div>

    </div>

</div>


<script>
/* =========================================================
   PROFESSIONAL GIFT CELEBRATION
   =========================================================

   Gift position:
       X ≈ 255
       Y ≈ 487

   Explosion:
       X = 215
       Y = 514

   Particles:
       Launch upward
       Slow at apex
       Float briefly
       Fall naturally
       Fade near bottom

   Lower safety boundary:
       Y = 691

   Nothing can visually enter below it.
   ========================================================= */


const celebration =
    document.getElementById("celebration");

const canvas =
    document.getElementById("fx");

const ctx =
    canvas.getContext("2d");

const gift =
    document.getElementById("gift");


/* =========================================================
   SCENE
   ========================================================= */

const W = 430;
const H = 691;

const DPR = 2;


/* =========================================================
   EXPLOSION LOCATION
   ========================================================= */

const EXPLOSION_X = W / 2;

/*
 * Gift starts at top 487.
 * Its visual center is around 514.
 */
const EXPLOSION_Y = 514;


/* =========================================================
   PARTICLE ARRAYS
   ========================================================= */

let particles = [];
let sparks = [];
let rings = [];


/* =========================================================
   RANDOM
   ========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


/* =========================================================
   CLAMP
   ========================================================= */

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* =========================================================
   PARTICLE
   ========================================================= */

class Particle {

    constructor(type, x, y) {

        this.type = type;

        this.x = x;
        this.y = y;

        /*
         * Random upward angle.
         *
         * Approximately:
         *
         *       ↖  ↑  ↗
         *
         * instead of everything
         * following one line.
         */

        const angle =
            random(
                Math.PI * 1.18,
                Math.PI * 1.82
            );

        /*
         * Different initial speeds.
         */

        const speed =
            type === "coin"
                ? random(155, 235)
                : random(120, 195);

        this.vx =
            Math.cos(angle) *
            speed;

        this.vy =
            Math.sin(angle) *
            speed;


        /*
         * Gravity.
         */

        this.gravity =
            type === "coin"
                ? random(245, 310)
                : random(175, 245);


        /*
         * Air resistance.
         */

        this.drag =
            type === "coin"
                ? random(.993, .997)
                : random(.989, .996);


        /*
         * Size.
         */

        this.size =
            type === "coin"
                ? random(7, 11)
                : random(4, 8);


        /*
         * Rotation.
         */

        this.rotation =
            random(
                0,
                Math.PI * 2
            );

        this.rotationSpeed =
            random(-13, 13);


        /*
         * Lifetime.
         */

        this.life = 0;

        this.maxLife =
            type === "coin"
                ? random(2.5, 3.4)
                : random(1.8, 2.8);


        /*
         * Natural side movement.
         */

        this.wave =
            random(
                0,
                Math.PI * 2
            );

        this.waveSpeed =
            random(2.2, 5.2);

        this.waveAmount =
            random(3, 12);


        /*
         * Alpha.
         */

        this.alpha = 1;
    }


    update(dt) {

        this.life += dt;


        /*
         * Gravity.
         *
         * This is what creates the
         * real up → apex → down feeling.
         */

        this.vy +=
            this.gravity * dt;


        /*
         * Air resistance.
         */

        this.vx *=
            Math.pow(
                this.drag,
                dt * 60
            );

        this.vy *=
            Math.pow(
                this.drag,
                dt * 30
            );


        /*
         * Horizontal movement.
         */

        this.x +=
            this.vx * dt;


        /*
         * Slight natural curve.
         */

        this.x +=
            Math.sin(
                this.life *
                this.waveSpeed +
                this.wave
            ) *
            this.waveAmount *
            dt;


        /*
         * Vertical movement.
         */

        this.y +=
            this.vy * dt;


        /*
         * Rotation.
         */

        this.rotation +=
            this.rotationSpeed *
            dt;


        /*
         * Fade close to bottom
         * of the allowed area.
         */

        if (
            this.y > 610 ||
            this.life >
            this.maxLife - .5
        ) {

            const bottomFade =
                clamp(
                    (691 - this.y) / 65,
                    0,
                    1
                );

            const lifeFade =
                clamp(
                    (this.maxLife - this.life) / .5,
                    0,
                    1
                );

            this.alpha =
                Math.min(
                    bottomFade,
                    lifeFade
                );
        }


        /*
         * Hard lower boundary.
         *
         * Absolutely nothing can
         * pass into the lower area.
         */

        if (this.y >= 686) {

            this.y = 686;

            this.vy *= -.12;

            this.alpha *= .65;
        }


        /*
         * Horizontal safety.
         */

        if (this.x < -40) {

            this.x = -40;

            this.vx *= -.25;
        }

        if (this.x > W + 40) {

            this.x = W + 40;

            this.vx *= -.25;
        }


        return (
            this.life <
            this.maxLife &&
            this.alpha > .01
        );
    }


    draw(ctx) {

        ctx.save();

        ctx.globalAlpha =
            this.alpha;

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );


        if (this.type === "coin") {

            this.drawCoin(ctx);

        } else if (
            this.type === "confetti"
        ) {

            this.drawConfetti(ctx);

        } else {

            this.drawSpark(ctx);
        }


        ctx.restore();
    }


    /* =====================================================
       COIN
       ===================================================== */

    drawCoin(ctx) {

        /*
         * Simulated 3D spin.
         */

        const spin =
            Math.abs(
                Math.cos(
                    this.rotation * .72
                )
            );


        const width =
            this.size *
            (.28 + spin * .72);


        const height =
            this.size * 1.15;


        const gradient =
            ctx.createRadialGradient(
                -width * .3,
                -height * .35,
                1,
                0,
                0,
                height
            );


        gradient.addColorStop(
            0,
            "#fff8b0"
        );

        gradient.addColorStop(
            .3,
            "#ffe14b"
        );

        gradient.addColorStop(
            .72,
            "#e8a914"
        );

        gradient.addColorStop(
            1,
            "#a86700"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            width,
            height,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.strokeStyle =
            "rgba(255,246,170,.9)";

        ctx.lineWidth = 1;

        ctx.stroke();


        /*
         * Dollar symbol.
         */

        ctx.save();

        ctx.scale(
            Math.max(
                .2,
                spin
            ),
            1
        );

        ctx.fillStyle =
            "rgba(120,72,0,.72)";

        ctx.font =
            `bold ${Math.max(
                6,
                this.size * .72
            )}px Arial`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "$",
            0,
            0
        );

        ctx.restore();
    }


    /* =====================================================
       CONFETTI
       ===================================================== */

    drawConfetti(ctx) {

        ctx.fillStyle =
            this.color ||
            "#ffd43b";


        ctx.fillRect(
            -this.size / 2,
            -this.size,
            this.size,
            this.size * 2.2
        );
    }


    /* =====================================================
       SPARK
       ===================================================== */

    drawSpark(ctx) {

        const s =
            this.size;


        ctx.fillStyle =
            "rgba(255,247,170,.95)";

        ctx.shadowColor =
            "rgba(255,215,50,.95)";

        ctx.shadowBlur = 9;


        ctx.beginPath();

        ctx.moveTo(
            0,
            -s * 1.8
        );

        ctx.lineTo(
            s * .35,
            -s * .35
        );

        ctx.lineTo(
            s * 1.8,
            0
        );

        ctx.lineTo(
            s * .35,
            s * .35
        );

        ctx.lineTo(
            0,
            s * 1.8
        );

        ctx.lineTo(
            -s * .35,
            s * .35
        );

        ctx.lineTo(
            -s * 1.8,
            0
        );

        ctx.lineTo(
            -s * .35,
            -s * .35
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   EXPLOSION
   ========================================================= */

function createExplosion() {

    /*
     * ===============================
     * COINS
     * ===============================
     */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const p =
            new Particle(
                "coin",
                EXPLOSION_X +
                random(-7, 7),

                EXPLOSION_Y +
                random(-4, 4)
            );


        particles.push(p);
    }


    /*
     * ===============================
     * CONFETTI
     * ===============================
     */

    const colors = [
        "#ff5264",
        "#ffd438",
        "#4ddfff",
        "#77ef78",
        "#c47cff",
        "#ffffff"
    ];


    for (
        let i = 0;
        i < 22;
        i++
    ) {

        const p =
            new Particle(
                "confetti",
                EXPLOSION_X +
                random(-6, 6),

                EXPLOSION_Y +
                random(-4, 4)
            );


        p.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        p.size =
            random(4, 7);


        p.maxLife =
            random(
                2.1,
                3.2
            );


        particles.push(p);
    }


    /*
     * ===============================
     * SPARKS
     * ===============================
     */

    for (
        let i = 0;
        i < 22;
        i++
    ) {

        const p =
            new Particle(
                "spark",
                EXPLOSION_X +
                random(-4, 4),

                EXPLOSION_Y +
                random(-3, 3)
            );


        p.maxLife =
            random(
                .55,
                1.25
            );


        p.gravity =
            random(
                90,
                170
            );


        p.vx *=
            random(
                .8,
                1.35
            );


        p.vy *=
            random(
                .75,
                1.15
            );


        sparks.push(p);
    }


    /*
     * ===============================
     * EXPLOSION RINGS
     * ===============================
     */

    rings.push({
        x: EXPLOSION_X,
        y: EXPLOSION_Y,

        radius: 3,

        alpha: .9,

        life: 0,

        maxLife: .42
    });


    rings.push({
        x: EXPLOSION_X,
        y: EXPLOSION_Y,

        radius: 2,

        alpha: .5,

        life: 0,

        maxLife: .7
    });
}


/* =========================================================
   RENDER
   ========================================================= */

let previous =
    performance.now();


function render(now) {

    const dt =
        Math.min(
            (now - previous) /
            1000,

            .033
        );


    previous = now;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    /*
     * Render at 2x resolution
     * for sharper OBS output.
     */

    ctx.scale(
        DPR,
        DPR
    );


    /*
     * ===============================
     * MAIN PARTICLES
     * ===============================
     */

    particles =
        particles.filter(
            particle => {

                const alive =
                    particle.update(dt);


                if (alive) {

                    particle.draw(ctx);
                }


                return alive;
            }
        );


    /*
     * ===============================
     * SPARKS
     * ===============================
     */

    sparks =
        sparks.filter(
            spark => {

                const alive =
                    spark.update(dt);


                if (alive) {

                    spark.draw(ctx);
                }


                return alive;
            }
        );


    /*
     * ===============================
     * EXPLOSION RINGS
     * ===============================
     */

    rings =
        rings.filter(
            ring => {

                ring.life += dt;


                const progress =
                    ring.life /
                    ring.maxLife;


                ring.radius +=
                    165 * dt;


                ring.alpha =
                    .85 *
                    (1 - progress);


                if (
                    ring.alpha > 0
                ) {

                    ctx.beginPath();


                    ctx.arc(
                        ring.x,
                        ring.y,
                        ring.radius,
                        0,
                        Math.PI * 2
                    );


                    ctx.strokeStyle =
                        `rgba(
                            255,
                            220,
                            70,
                            ${ring.alpha}
                        )`;


                    ctx.lineWidth =
                        2.5 *
                        (1 - progress);


                    ctx.shadowColor =
                        "rgba(255,200,30,.8)";


                    ctx.shadowBlur = 10;


                    ctx.stroke();
                }


                return (
                    ring.life <
                    ring.maxLife
                );
            }
        );


    ctx.restore();


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   CELEBRATION CYCLE
   ========================================================= */

let running = false;


function resetGift() {

    gift.classList.remove(
        "show",
        "shake",
        "explode"
    );


    /*
     * Force browser to reset
     * CSS animation state.
     */

    void gift.offsetWidth;


    gift.classList.add(
        "show"
    );
}


function playCelebration() {

    if (running) {
        return;
    }


    running = true;


    /*
     * Clean old particles.
     */

    particles.length = 0;

    sparks.length = 0;

    rings.length = 0;


    /*
     * Gift appears.
     */

    resetGift();


    /*
     * Small anticipation.
     */

    setTimeout(
        () => {

            gift.classList.add(
                "shake"
            );

        },
        2400
    );


    /*
     * Explosion.
     */

    setTimeout(
        () => {

            gift.classList.remove(
                "shake"
            );


            gift.classList.add(
                "explode"
            );


            createExplosion();

        },
        2920
    );


    /*
     * Long enough pause before
     * the next Gift.
     */

    setTimeout(
        () => {

            running = false;

            playCelebration();

        },
        8500
    );
}


/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
    render
);


setTimeout(
    () => {

        playCelebration();

    },
    700
);

</script>

</body>
</html>
